<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>cover</title>
<style>
@font-face{font-family:'Noto Sans SC';src:url('../engine/fonts/NotoSansSC.ttf') format('truetype');font-weight:100 900;font-display:block}
@font-face{font-family:'Space Grotesk';src:url('../engine/fonts/SpaceGrotesk.ttf') format('truetype');font-weight:300 700;font-display:block}
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:#0a0f1e;overflow:hidden}
#c{position:relative;overflow:hidden;background:#0a0f1e;color:#fff;font-family:'Noto Sans SC','Space Grotesk',sans-serif;-webkit-font-smoothing:antialiased}
.t{position:absolute;white-space:nowrap}
.tileWrap{position:absolute}
.tile{position:relative;overflow:hidden;display:flex;align-items:center;justify-content:center;background:#fff;box-shadow:0 18px 44px rgba(0,0,0,.35)}
.tile img{display:block;object-fit:contain}
.tile.full{background:transparent;box-shadow:none;overflow:visible}
.tile.full img{width:100%;height:100%;filter:drop-shadow(0 14px 28px rgba(0,0,0,.35))}
.mono{font:700 40px 'Space Grotesk';color:#222}
</style>
</head>
<body>
<div id="c"></div>
<script>
const DATA = window.DATA, RATIO = window.RATIO;           // RATIO: '16x9' | '4x3'
const I = DATA.intro;
const c = document.getElementById('c');
const mk = (tag, cls, parent, html) => { const e = document.createElement(tag); if (cls) e.className = cls; if (html != null) e.innerHTML = html; if (parent) parent.appendChild(e); return e; };

function makeTile(id, size) {
  const L = DATA.logos[id] || {};
  const wrap = mk('div', 'tileWrap'); wrap.style.width = wrap.style.height = size + 'px';
  const tile = mk('div', 'tile', wrap); tile.style.width = tile.style.height = size + 'px';
  tile.style.borderRadius = Math.round(size * (L.radius || 0.22)) + 'px';
  if (L.fit === 'full' && L.file) { tile.classList.add('full'); mk('img', null, tile).src = L.file; }
  else {
    if (L.plate) tile.style.background = L.plate;
    if (L.file) { const img = mk('img', null, tile); img.src = L.file; img.style.width = img.style.height = (L.pad || 0.62) * size + 'px'; }
    else mk('div', 'mono', tile, (L.label || id).slice(0, 2));
  }
  return wrap;
}

const L = RATIO === '16x9'
  ? { W: 1920, H: 1080, x0: 118, align: 'left',   l1: [250, 104], l2: [380, 196], l3: [572, 236], cols: 4, tile: 150, gap: 16, gx: 1160, gy: 216 }
  : { W: 1440, H: 1080, x0: 0,   align: 'center', l1: [88, 92],   l2: [196, 176], l3: [366, 214], cols: 8, tile: 138, gap: 14, gx: 119,  gy: 712 };
c.style.width = L.W + 'px'; c.style.height = L.H + 'px';
document.documentElement.style.width = L.W + 'px'; document.body.style.width = L.W + 'px';

function line(text, [top, size], weight, font, color, ls) {
  const e = mk('div', 't', c, text);
  e.style.cssText += `top:${top}px;font:${weight} ${size}px/1.05 ${font};letter-spacing:${ls};` + (color ? `color:${color};` : '') +
    (L.align === 'center' ? `left:0;width:${L.W}px;text-align:center;` : `left:${L.x0}px;`);
  return e;
}
line(I.line1, L.l1, 800, "'Noto Sans SC'", null, '.06em');
line(I.line2, L.l2, 700, "'Space Grotesk','Noto Sans SC'", I.accent, '-.01em');
line(I.line3, L.l3, 900, "'Noto Sans SC'", null, '.02em');
I.grid.forEach((id, j) => {
  const w = makeTile(id, L.tile);
  w.style.left = (L.gx + (j % L.cols) * (L.tile + L.gap)) + 'px';
  w.style.top = (L.gy + Math.floor(j / L.cols) * (L.tile + L.gap)) + 'px';
  c.appendChild(w);
});
window.__ready = document.fonts.load("900 100px 'Noto Sans SC'").then(() => document.fonts.load("700 50px 'Space Grotesk'")).then(() => document.fonts.ready).then(() =>
  new Promise(r => { const imgs = [...document.images]; let n = imgs.length; if (!n) return r(true); imgs.forEach(im => { if (im.complete) { if (!--n) r(true); } else { im.onload = im.onerror = () => { if (!--n) r(true); }; } }); }));
</script>
</body>
</html>
