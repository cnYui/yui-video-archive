<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<!-- 《Claude Fable 5.5 模型介绍》整片：2340×1080，30 fps，白底。renderAt(t) 画出第 t 秒（同一个 t 永远是同一帧）。
     数据：timeline.js（build_timeline.py）、frames.js（prep_frames.py）。
     版式照白宫《超级智能协定》那条：全程画外音、不放出镜框，左栏换成“本期素材”缩略图列表，演示区 1636×920（内容按 1474×829 写，整体 scale）放素材画面或卡片，字幕在 y 966 以下。
     脚本：scenes.js（叠加层、卡片）→ engine.js（renderAt）。 -->
<link rel="stylesheet" href="file:///D:/大疆/AI科普/素材/字体/fonts.css">
<style>
:root { --ink:#1B1B1F; --ink2:#374151; --gray:#6B7280; --gray2:#9AA1AC; --line:#E5E7EB; --soft:#F4F5F7; --orange:#FF4F1A; --marker:#FFD84D; --green:#16A34A; --blue:#2563EB; --red:#E11D48; }
* { box-sizing:border-box; margin:0; padding:0; }
html, body { width:2340px; height:1080px; background:#fff; overflow:hidden; font-family:'Noto Sans SC', sans-serif; color:var(--ink); }
.abs { position:absolute; }
.frame { position:absolute; background:#fff; padding:14px; border:1px solid var(--line); border-radius:10px; box-shadow:0 14px 36px rgba(0,0,0,.14); }
.frame .inner { position:relative; width:100%; height:100%; border-radius:4px; overflow:hidden; background:#EEF0F3; }
.tape { position:absolute; width:150px; height:40px; background:rgba(255,214,140,.8); top:-18px; box-shadow:0 1px 2px rgba(0,0,0,.08); z-index:3; }
.tape.l { left:44px; transform:rotate(-7deg); } .tape.r { right:44px; transform:rotate(6deg); }
.chip { display:inline-block; padding:5px 18px; border:3px solid var(--orange); color:var(--orange); border-radius:999px; font:800 26px 'Noto Sans SC'; white-space:nowrap; }
.chip.fill { background:var(--orange); color:#fff; }
.mark { background:linear-gradient(transparent 58%, var(--marker) 58%, var(--marker) 92%, transparent 92%); }

/* 左栏：本期素材 */
#toc { position:absolute; left:40px; top:178px; width:560px; padding:26px 30px 18px; background:rgba(255,255,255,.96); border-top:3px solid var(--orange); border-left:1px solid #E6E6E6; border-right:1px solid #E6E6E6; border-bottom:1px solid #E6E6E6; box-shadow:0 6px 18px rgba(0,0,0,.08); }
#toc .t { font:800 34px 'Noto Sans SC'; margin-bottom:14px; white-space:nowrap; }
#toc .t span { display:block; font:600 22px 'Noto Sans SC'; color:var(--gray2); margin:6px 0 0 0; }
#toc .it { display:flex; align-items:center; gap:18px; padding:9px 0; border-top:1px solid #EEF0F3; }
#toc .it .th { flex:none; position:relative; width:176px; height:99px; border-radius:8px; overflow:hidden; background:#E5E7EB; opacity:.5; filter:grayscale(.75); }
#toc .it .th img { display:block; width:100%; height:100%; object-fit:cover; }
#toc .it .tx { min-width:0; }
#toc .it .n { font:700 20px 'Space Grotesk'; color:var(--gray2); white-space:nowrap; letter-spacing:.04em; }
#toc .it .nm { font:700 26px/1.3 'Noto Sans SC'; color:#9AA1AC; margin-top:4px; }
#toc .it.done .th { opacity:.85; filter:grayscale(.35); }
#toc .it.done .nm { color:var(--gray); }
#toc .it.now .th { opacity:1; filter:none; outline:5px solid var(--orange); outline-offset:-1px; }
#toc .it.now .n { color:var(--orange); }
#toc .it.now .nm { color:var(--ink); font-weight:800; }

/* 演示区 */
#demo { left:636px; top:18px; width:1664px; height:948px; }
#demoin { position:absolute; left:0; top:0; width:1474px; height:829px; transform-origin:0 0; transform:scale(1.10990); }
#cardbg { position:absolute; inset:0; background:linear-gradient(160deg, #F6F7F9 0%, #E7EBF0 100%); }
#scrimg { position:absolute; left:0; top:0; width:100%; height:100%; display:block; visibility:hidden; background:#000; }
#ovB { position:absolute; inset:0; }
.nametag { position:absolute; left:22px; top:20px; display:flex; align-items:stretch; border-radius:12px; overflow:hidden; box-shadow:0 8px 20px rgba(0,0,0,.28); z-index:5; }
.nametag .m { background:var(--orange); color:#fff; font:800 28px 'Noto Sans SC'; padding:8px 20px; white-space:nowrap; }
.nametag .e { background:rgba(17,17,17,.88); color:#fff; font:700 24px 'Space Grotesk'; padding:8px 20px; white-space:nowrap; letter-spacing:.04em; display:flex; align-items:center; }
.credit { position:absolute; right:22px; top:20px; background:rgba(17,17,17,.86); color:#fff; font:700 26px 'Noto Sans SC'; padding:8px 20px; border-radius:12px; white-space:nowrap; z-index:5; }
.cappill { position:absolute; left:22px; bottom:22px; background:rgba(255,255,255,.95); border-left:8px solid var(--orange); border-radius:12px; box-shadow:0 8px 20px rgba(0,0,0,.28); padding:8px 24px 9px 20px; z-index:5; }
.cappill b { display:block; font:800 32px/1.3 'Noto Sans SC'; color:var(--ink); white-space:nowrap; }
.cappill small { display:block; font:600 22px/1.35 'Noto Sans SC'; color:var(--gray); white-space:nowrap; }

/* 开场标题（盖在快剪上） */
.dim { position:absolute; inset:0; background:radial-gradient(ellipse at 50% 52%, rgba(8,10,14,.46), rgba(8,10,14,.78)); }
.ttl { position:absolute; left:0; right:0; text-align:center; color:#fff; white-space:nowrap; }
.ttl .k { font:700 26px 'Noto Sans SC'; letter-spacing:.34em; color:#FDBA74; }
.ttl .a { font:800 118px/1.1 'Noto Sans SC'; letter-spacing:.01em; text-shadow:0 6px 30px rgba(0,0,0,.45); }
.ttl .b { font:900 206px/1.04 'Noto Sans SC'; color:#FF7A3D; letter-spacing:-.01em; text-shadow:0 8px 40px rgba(0,0,0,.5); }
.ttl .chip { color:#fff; border-color:rgba(255,255,255,.88); background:rgba(255,255,255,.12); font-size:30px; }
.ttl .chip.fill { background:var(--orange); border-color:var(--orange); }

/* 收尾卡片 */
.kick { font:700 26px 'Noto Sans SC'; letter-spacing:.2em; color:var(--orange); white-space:nowrap; }
.h1 { font:800 60px/1.25 'Noto Sans SC'; white-space:nowrap; }
.h2 { font:800 46px/1.3 'Noto Sans SC'; white-space:nowrap; }
.cap { position:absolute; font:700 28px/1.45 'Noto Sans SC'; color:var(--gray); }
.photo { position:absolute; background:#fff; padding:9px; border-radius:6px; box-shadow:0 16px 34px rgba(0,0,0,.26), 0 0 0 2px rgba(0,0,0,.07); }
.photo img { display:block; width:100%; height:auto; }
.qrtile { position:absolute; background:#fff; border-radius:22px; padding:24px; border:3px solid var(--line); box-shadow:0 14px 36px rgba(0,0,0,.16); }
.qrtile img { display:block; width:100%; height:100%; image-rendering:pixelated; }
.urlpill { position:absolute; left:0; right:0; margin:0 auto; width:max-content; background:var(--ink); color:#fff; font:800 40px 'Space Grotesk'; letter-spacing:.01em; border-radius:18px; padding:14px 34px; white-space:nowrap; box-shadow:0 10px 26px rgba(0,0,0,.25); }

/* 官方现状卡片：已公布 / 未公布 / 传闻 */
.frow { position:absolute; display:flex; align-items:center; gap:28px; background:#fff; border:3px solid var(--line); border-radius:20px; box-shadow:0 10px 24px rgba(0,0,0,.08); padding:0 36px 0 30px; }
.frow .fl { flex:none; width:150px; text-align:center; font:800 34px 'Noto Sans SC'; color:#fff; background:var(--ink); border-radius:14px; padding:10px 0; }
.frow.ok { border-color:#BBF7D0; } .frow.ok .fl { background:var(--green); }
.frow.no { border-color:#FECDD3; } .frow.no .fl { background:var(--red); }
.frow.rumor { border-color:#FED7AA; } .frow.rumor .fl { background:var(--orange); }
.frow .fv { font:800 37px/1.38 'Noto Sans SC'; color:var(--ink); }
.frow .fv small { display:block; font:600 24px/1.4 'Noto Sans SC'; color:var(--gray); margin-top:4px; }

/* 字幕 */
#subs { position:absolute; left:0; top:966px; width:2340px; height:110px; z-index:30; pointer-events:none; }
#subZh { position:absolute; left:0; right:0; top:10px; text-align:center; font:800 52px/66px 'Noto Sans SC'; color:var(--ink); -webkit-text-stroke:10px #fff; paint-order:stroke fill; white-space:nowrap; }
</style>
</head>
<body>
<div class="frame" id="demo"><div class="tape l"></div><div class="tape r"></div>
  <div class="inner"><div id="demoin">
    <div id="cardbg"></div>
    <img id="scrimg">
    <div id="ovB"></div>
  </div></div>
</div>
<div id="toc"></div>
<div id="subs"><div id="subZh"></div></div>
<script src="timeline.js"></script>
<script src="frames.js"></script>
<script src="scenes.js"></script>
<script src="engine.js"></script>
</body>
</html>
