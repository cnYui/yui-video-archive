<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>原LAI如此 #01 封面 · 小票卡片</title>
<link rel="stylesheet" href="../../../制作/fonts/fonts.css">
<style>
  :root {
    --paper: #EDEAE3;
    --ink: #141414;
    --ink2: #57534C;
    --ink3: #A29D93;
    --orange: #FF4F1A;
    --navy: #1B2340;
    --pink: #F2A0BD; --yellow: #F6C945; --blue: #4A6FD0; --kred: #E2463F;
    --cjk: 'Noto Sans SC', sans-serif;
    --mono: 'JetBrains Mono', 'Noto Sans SC', monospace;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; width: 1920px; height: 1080px; overflow: hidden; background: var(--navy); }
  body { font-family: var(--cjk); -webkit-font-smoothing: antialiased; }
  #stage { position: absolute; inset: 0; overflow: hidden; background: var(--navy); }

  /* ---------- background: STARRY, pressed down hard ---------- */
  #bgImg { position: absolute; left: -40px; top: -24px; width: 2000px; height: 1128px; object-fit: cover;
           filter: blur(7px); opacity: .40; }
  #bgTint { position: absolute; inset: 0;
            background: radial-gradient(ellipse 62% 70% at 34% 62%, rgba(90,110,190,.16), rgba(27,35,64,0) 70%),
                        radial-gradient(ellipse 80% 90% at 50% 50%, rgba(0,0,0,0) 45%, rgba(8,10,20,.55) 100%); }

  /* ---------- the receipt ---------- */
  #receipt { position: absolute; left: 712px; top: -14px; width: 924px; height: 930px;
             transform: rotate(-1.2deg); transform-origin: 50% 0; }
  #receiptShadow { position: absolute; inset: 0; background: rgba(0,0,0,.55); filter: blur(26px);
                   transform: translate(10px, 22px); }
  #paper { position: absolute; inset: 0; background: var(--paper); overflow: hidden; }
  #paperGrain { position: absolute; left: 0; top: 0; opacity: .9; }
  #slotShade { position: absolute; left: 0; right: 0; top: 0; height: 60px;
               background: linear-gradient(to bottom, rgba(0,0,0,.20), rgba(0,0,0,0)); }
  #curl { position: absolute; inset: 0;
          background: linear-gradient(90deg, rgba(0,0,0,.07), rgba(0,0,0,0) 8%, rgba(0,0,0,0) 92%, rgba(0,0,0,.06)); }
  #content { position: absolute; left: 60px; right: 60px; top: 58px; color: var(--ink); }

  .head { display: flex; align-items: center; justify-content: space-between; height: 64px; }
  .series { font: 900 50px/1 var(--cjk); letter-spacing: .02em; white-space: nowrap; display: flex; align-items: center; }
  .series .sq { width: 26px; height: 26px; background: var(--orange); margin-right: 18px; }
  .series .lai { color: var(--orange); }
  .epi { font: 800 44px/1 var(--mono); letter-spacing: .02em; color: var(--paper); background: var(--ink);
         padding: 9px 16px 10px; border-radius: 4px; }
  .rule { height: 2px; background-image: repeating-linear-gradient(90deg, var(--ink3) 0 10px, transparent 10px 18px); }
  .rule.double { height: 8px; background:
      linear-gradient(var(--ink), var(--ink)) 0 0 / 100% 4px no-repeat,
      linear-gradient(var(--ink), var(--ink)) 0 100% / 100% 2px no-repeat; }
  .kick { font: 600 22px/1 var(--mono); letter-spacing: .3em; color: var(--ink2); display: flex; justify-content: space-between; align-items: center; }

  .t1 { font: 900 360px/0.86 var(--cjk); letter-spacing: -.01em; margin-left: -14px; white-space: nowrap; }
  .t2 { font: 900 232px/1 var(--cjk); letter-spacing: .0em; margin-left: -8px; white-space: nowrap; }
  .t2 .q { color: var(--orange); }
  .sub { font: 700 34px/1.2 var(--cjk); white-space: nowrap; letter-spacing: .01em; }
  .sub .o { color: var(--orange); }
  .sub .dot { color: var(--ink3); margin: 0 .3em; }

  .foot { display: flex; align-items: flex-end; justify-content: space-between; }
  .digits { font: 500 18px/1 var(--mono); letter-spacing: .32em; color: var(--ink2); margin-top: 10px; }
  .kb { display: flex; gap: 8px; }
  .kb i { display: block; width: 46px; height: 16px; border: 2px solid var(--ink); border-radius: 8px; }

  /* ---------- Ryo ---------- */
  #ryo { position: absolute; image-rendering: pixelated; }
  #ryoShadow { position: absolute; border-radius: 50%;
               background: radial-gradient(closest-side, rgba(0,0,0,.45), rgba(0,0,0,0)); }
</style>
</head>
<body>
<div id="stage">
  <img id="bgImg" src="../../../制作/assets/bg/bg1.png" alt="">
  <div id="bgTint"></div>

  <div id="receipt">
    <div id="receiptShadow"></div>
    <div id="paper">
      <canvas id="paperGrain" width="960" height="930"></canvas>
      <div id="content">
        <div class="head">
          <div class="series"><span class="sq"></span>原<span class="lai">LAI</span>如此</div>
          <div class="epi">#01</div>
        </div>
        <div class="rule double" style="margin-top:22px"></div>
        <div class="kick" style="margin-top:22px"><span class="kb"><i style="background:var(--pink)"></i><i style="background:var(--yellow)"></i><i style="background:var(--blue)"></i><i style="background:var(--kred)"></i></span><span>RECEIPT</span></div>
        <div id="title">
          <div class="t1" style="margin-top:26px">API</div>
          <div class="t2" style="margin-top:6px">是什么<span class="q">？</span></div>
        </div>
        <div class="rule" style="margin-top:30px"></div>
        <div class="sub" id="sub" style="margin-top:26px">“已接入 <span class="o">DeepSeek</span>”接的是什么<span class="dot">/</span>API Key 怎么拿</div>
      </div>
      <div id="curl"></div>
      <div id="slotShade"></div>
    </div>
  </div>

  <div id="ryoShadow"></div>
  <img id="ryo" src="../../../制作/assets/sprites/reach_m2/00.png" alt="">
</div>

<script>
(function () {
  'use strict';
  window.DURATION = 1;
  // final framing (round 4); window.__DATA__ can override any key for variant tests
  const D = Object.assign({
    scale: 11, ryoX: 172, foot: 905, receiptX: 712,
    bg: { scale: 1.78, signX: 440, signY: 165, opacity: .36, blur: 8 },
  }, window.__DATA__ || {});

  function mulberry32(a) { return function () { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }

  if (D.titleHTML) document.getElementById('title').innerHTML = D.titleHTML;
  if (D.subHTML) document.getElementById('sub').innerHTML = D.subHTML;

  // background framing: scale + where the STARRY sign (source px 1075,380) lands
  if (D.bg) {
    const b = document.getElementById('bgImg'), sc = D.bg.scale;
    b.style.objectFit = 'fill';
    b.style.width = (1920 * sc) + 'px'; b.style.height = (1080 * sc) + 'px';
    b.style.left = (D.bg.signX - 1075 * sc) + 'px'; b.style.top = (D.bg.signY - 380 * sc) + 'px';
    if (D.bg.opacity) b.style.opacity = D.bg.opacity;
    if (D.bg.blur) b.style.filter = `blur(${D.bg.blur}px)`;
  }
  if (D.receiptX) document.getElementById('receipt').style.left = D.receiptX + 'px';

  // paper grain (seeded, static)
  const cv = document.getElementById('paperGrain'), cx = cv.getContext('2d');
  const img = cx.createImageData(cv.width, cv.height), d = img.data, rnd = mulberry32(7);
  for (let i = 0; i < d.length; i += 4) { const v = rnd(); d[i] = d[i + 1] = d[i + 2] = v < .5 ? 60 : 255; d[i + 3] = Math.round(Math.abs(v - .5) * 2 * 16); }
  cx.putImageData(img, 0, 0);

  // torn zig-zag bottom edge
  const paper = document.getElementById('paper'), shadow = document.getElementById('receiptShadow');
  const PW = document.getElementById('receipt').offsetWidth, TW = 28, TH = 14, n = Math.round(PW / TW), tw = PW / n;
  const pts = ['0 0', '100% 0', `100% calc(100% - ${TH}px)`];
  for (let i = n; i >= 0; i--) pts.push(`${(i * tw).toFixed(2)}px calc(100% - ${i % 2 ? 0 : TH}px)`);
  pts.push(`0 calc(100% - ${TH}px)`);
  paper.style.clipPath = shadow.style.clipPath = `polygon(${pts.join(',')})`;

  // Ryo: integer nearest-neighbour scale, never mirrored
  const S = D.scale, FX = D.ryoX ?? 196, FOOT = D.foot ?? 918;
  const ryo = document.getElementById('ryo');
  ryo.style.width = ryo.style.height = (64 * S) + 'px';
  ryo.style.left = FX + 'px';
  ryo.style.top = (FOOT - 62 * S) + 'px';
  // 1-sprite-pixel ink outline (3x3 dilation), pixel-crisp
  const o = S;
  ryo.style.filter = `drop-shadow(${o}px 0 0 #141414) drop-shadow(-${o}px 0 0 #141414) drop-shadow(0 ${o}px 0 #141414) drop-shadow(0 -${o}px 0 #141414)`;
  const sh = document.getElementById('ryoShadow');
  sh.style.left = (FX + 12 * S) + 'px'; sh.style.width = (40 * S) + 'px';
  sh.style.top = (FOOT - 2 * S) + 'px'; sh.style.height = (5 * S) + 'px';
})();
</script>
</body>
</html>
