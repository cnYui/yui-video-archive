<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>原LAI如此 封面</title>
<link rel="stylesheet" href="{{FONTS_CSS}}">
<style>
  :root {
    --paper: #EDEAE3;
    --ink: #141414;
    --ink2: #57534C;
    --ink3: #A29D93;
    --orange: #FF4F1A;
    --navy: #1B2340;
    --pink: #F2A0BD; --yellow: #F6C945; --blue: #4A6FD0; --kred: #E2463F;
    --cjk: 'Noto Sans SC', sans-serif;
    --mono: 'JetBrains Mono', 'Noto Sans SC', monospace;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; width: 1920px; height: 1080px; overflow: hidden; background: var(--navy); }
  body { font-family: var(--cjk); -webkit-font-smoothing: antialiased; }
  #stage { position: absolute; inset: 0; overflow: hidden; background: var(--navy); }

  /* ---------- background: STARRY interior, blurred and pressed down ---------- */
  #bgImg { position: absolute; object-fit: fill; }
  #bgTint { position: absolute; inset: 0;
            background: radial-gradient(ellipse 80% 90% at 50% 50%, rgba(0,0,0,0) 45%, rgba(8,10,20,.55) 100%); }
  /* warm spotlight behind the presenter so her outline separates from the dark room */
  #spot { position: absolute; border-radius: 50%; }

  /* ---------- the receipt ---------- */
  #receipt { position: absolute; transform-origin: 50% 0; }
  #receiptShadow { position: absolute; inset: 0; background: rgba(0,0,0,.55); filter: blur(26px);
                   transform: translate(10px, 22px); }
  #paper { position: absolute; inset: 0; background: var(--paper); overflow: hidden; }
  #paperGrain { position: absolute; left: 0; top: 0; opacity: .9; }
  #slotShade { position: absolute; left: 0; right: 0; top: 0; height: 60px;
               background: linear-gradient(to bottom, rgba(0,0,0,.20), rgba(0,0,0,0)); }
  #curl { position: absolute; inset: 0;
          background: linear-gradient(90deg, rgba(0,0,0,.07), rgba(0,0,0,0) 8%, rgba(0,0,0,0) 92%, rgba(0,0,0,.06)); }
  #content { position: absolute; top: 56px; color: var(--ink); }

  .head { display: flex; align-items: center; justify-content: space-between; height: 64px; }
  .series { font: 900 50px/1 var(--cjk); letter-spacing: .02em; white-space: nowrap; display: flex; align-items: center; }
  .series .sq { width: 26px; height: 26px; background: var(--orange); margin-right: 18px; }
  .series .lai { color: var(--orange); }
  .headR { display: flex; align-items: center; gap: 22px; }
  .kb { display: flex; gap: 7px; }
  .kb i { display: block; width: 40px; height: 16px; border: 2px solid var(--ink); border-radius: 8px; }
  .epi { font: 800 44px/1 var(--mono); letter-spacing: .02em; color: var(--paper); background: var(--ink);
         padding: 9px 16px 10px; border-radius: 4px; }
  .rule { height: 2px; background-image: repeating-linear-gradient(90deg, var(--ink3) 0 10px, transparent 10px 18px); }
  .rule.double { height: 8px; background:
      linear-gradient(var(--ink), var(--ink)) 0 0 / 100% 4px no-repeat,
      linear-gradient(var(--ink), var(--ink)) 0 100% / 100% 2px no-repeat; }

  .t1 { font-weight: 900; font-family: var(--cjk); white-space: nowrap; }
  .t2 { font-weight: 900; font-family: var(--cjk); white-space: nowrap; }
  .t2 .q { color: var(--orange); }
  .sub { font-family: var(--cjk); font-weight: 800; white-space: nowrap; letter-spacing: 0; }
  .sub .hl { background: linear-gradient(180deg, transparent 52%, var(--yellow) 52%, var(--yellow) 94%, transparent 94%);
             padding: 0 6px; margin: 0 -2px 0 -6px; }
  .sub .qm { font-weight: 800; }
  .sub .qm.o1 { margin-left: -.36em; }
  .sub .qm.c { margin-right: -.44em; }
  .sub .o { color: var(--orange); }

  /* ---------- the presenter (ids #ryo / #ryoShadow are historic) + pixel "?" ---------- */
  #ryo { position: absolute; image-rendering: pixelated; }
  #ryoShadow { position: absolute; border-radius: 50%;
               background: radial-gradient(closest-side, rgba(0,0,0,.7), rgba(0,0,0,.4) 55%, rgba(0,0,0,0)); }
  #floor { position: absolute; border-radius: 50%;
           background: radial-gradient(closest-side, rgba(255,214,170,.20), rgba(255,214,170,.07) 60%, rgba(255,214,170,0)); }
  canvas.px { position: absolute; image-rendering: pixelated; }

  /* ---------- plain page (cover.json "plain": "#FFFFFF"): one solid colour instead of the photo; no vignette, warm
     light or floor glow, softer shadows (第 4 期白底，2026-09-28) ---------- */
  body.plain, body.plain #stage { background: var(--plainBg); }
  body.plain #bgImg, body.plain #bgTint, body.plain #spot, body.plain #floor { display: none; }
  body.plain #receiptShadow { background: rgba(0,0,0,.2); filter: blur(22px); transform: translate(8px, 16px); }
  body.plain #ryoShadow { background: radial-gradient(closest-side, rgba(0,0,0,.26), rgba(0,0,0,.12) 55%, rgba(0,0,0,0)); }
</style>
</head>
<body>
<div id="stage">
  <img id="bgImg" src="{{BG}}" alt="">
  <div id="bgTint"></div>
  <div id="spot"></div>

  <div id="receipt">
    <div id="receiptShadow"></div>
    <div id="paper">
      <canvas id="paperGrain" width="960" height="1000"></canvas>
      <div id="content">
        <div class="head">
          <div class="series"><span class="sq"></span>原<span class="lai">LAI</span>如此</div>
          <div class="headR">
            <span class="kb"><i style="background:var(--pink)"></i><i style="background:var(--yellow)"></i><i style="background:var(--blue)"></i><i style="background:var(--kred)"></i></span>
            <div class="epi" id="epi">#NN</div>
          </div>
        </div>
        <div class="rule double" id="dbl"></div>
        <div id="title">
          <div class="t1" id="t1"></div>
          <div class="t2" id="t2"></div>
        </div>
        <div class="rule" id="dash"></div>
        <div class="sub" id="sub"></div>
      </div>
      <div id="curl"></div>
      <div id="slotShade"></div>
    </div>
  </div>

  <div id="floor"></div>
  <div id="ryoShadow"></div>
  <img id="ryo" src="{{SPRITE}}" alt="">
  <canvas class="px" id="qmark"></canvas>
</div>

<script>
(function () {
  'use strict';
  window.DURATION = 1;
  window.__READY__ = false;   // render.py waits until layout below has measured the real fonts
  // Defaults = the #01 cover (山田凉). make_cover.py → window.__DATA__ = the presenter's cover overrides
  // (scripts/epcommon.py PRESENTERS[..].cover) under 封面/cover.json; object keys (bg, spot, q, shadow, floor) merge
  // one level deep, so {"q": {"on": false}} only switches the question mark off.
  //   number: 2            → "#02" on the receipt
  //   t1: "Token"          big line (auto-shrinks to fit the receipt)
  //   t2: "是什么？"        second line; a trailing ？/? is coloured orange
  //   subHTML: '<span class="hl">一句话</span>花了多少钱<span class="o">？</span>'
  //            .hl = yellow highlighter, .o = orange, .qm = tight CJK quote mark
  const DEF = {
    number: 1, t1: 'API', t2: '是什么？',
    subHTML: '<span class="hl"><span class="qm o1">“</span>已接入 DeepSeek<span class="qm c">”</span></span>接的是什么<span class="o">？</span>',
    // background: cover-fit the image, then zoom by `scale` around focus point (fx, fy) in 0..1 of the image
    bg: { scale: 1.0, fx: .5, fy: .5, opacity: .36, blur: 8 },
    spot: { x: 500, y: 600, w: 760, h: 820, a: .16 },
    // receipt
    rx: 726, rw: 904, rh: 946, rtop: -14, rot: -1.2, pad: 54,
    headGap: 20, t1px: 456, t1lh: .84, t1ls: -.005, t1ml: -16, t1mt: 12,
    t2px: 232, t2mt: 4, t2ml: -8, dashMt: 24, subpx: 52, subMt: 20,
    // the presenter (sprite = 封面 sprite, e.g. reach_m2/00.png of her frames): integer nearest-neighbour `scale`,
    // never mirrored; ryoX = left edge of the 64 px frame (the name is historic: it is the x of any presenter),
    // foot = screen y of her soles (frame row footRow), frame = sprite size in px
    scale: 11, ryoX: 184, foot: 908, footRow: 62, frame: [64, 64], outline: ['#141414', '#EDEAE3'],
    // cast shadow / warm floor glow under her, in sprite px relative to (ryoX, foot)
    shadow: { x: 6, w: 52, y: -2, h: 8 }, floor: { x: -4, w: 72, y: -7, h: 16 },
    // pixel question mark on the same grid as the sprite: x / y in screen px, or sx / sy in sprite px from the frame's
    // top-left (sx / sy win when given, so the mark follows scale / ryoX; #01: x 591, y 138 = sx 37, sy -8)
    q: { on: true, x: 591, y: 138, fill: '#F6C945' },
  };
  const IN = window.__DATA__ || {};
  const D = Object.assign({}, DEF, IN);
  for (const k of Object.keys(DEF)) {
    const a = DEF[k], b = IN[k];
    if (a && b && typeof a === 'object' && typeof b === 'object' && !Array.isArray(a) && !Array.isArray(b)) D[k] = Object.assign({}, a, b);
  }
  window.__D__ = D;

  function mulberry32(a) { return function () { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
  const $ = (id) => document.getElementById(id);
  const px = (v) => v + 'px';
  //   plain: '#FFFFFF'     solid page colour instead of the background photo (make_cover.py then needs no bg_file)
  if (D.plain) { document.body.classList.add('plain'); document.body.style.setProperty('--plainBg', D.plain); }

  // ---- background framing (cover-fit + zoom around a focus point; set after the image has decoded)
  const b = $('bgImg');
  b.style.opacity = D.bg.opacity; b.style.filter = `blur(${D.bg.blur}px)`;
  function frameBg() {
    const iw = b.naturalWidth || 1920, ih = b.naturalHeight || 1080;
    const k = Math.max(1920 / iw, 1080 / ih) * (D.bg.scale || 1);
    const w = iw * k, h = ih * k;
    const left = Math.min(0, Math.max(1920 - w, 960 - D.bg.fx * w));
    const top = Math.min(0, Math.max(1080 - h, 540 - D.bg.fy * h));
    b.style.width = px(w); b.style.height = px(h); b.style.left = px(left); b.style.top = px(top);
  }
  const sp = $('spot');
  sp.style.left = px(D.spot.x - D.spot.w / 2); sp.style.top = px(D.spot.y - D.spot.h / 2);
  sp.style.width = px(D.spot.w); sp.style.height = px(D.spot.h);
  sp.style.background = `radial-gradient(closest-side, rgba(255,214,170,${D.spot.a}), rgba(255,214,170,${D.spot.a * .45}) 55%, rgba(255,214,170,0))`;

  // ---- receipt geometry + type sizes
  const r = $('receipt');
  r.style.left = px(D.rx); r.style.top = px(D.rtop); r.style.width = px(D.rw); r.style.height = px(D.rh);
  r.style.transform = `rotate(${D.rot}deg)`;
  const c = $('content'); c.style.left = px(D.pad); c.style.right = px(D.pad);
  $('dbl').style.marginTop = px(D.headGap);
  const t1 = $('t1');
  t1.style.fontSize = px(D.t1px); t1.style.lineHeight = D.t1lh; t1.style.letterSpacing = D.t1ls + 'em';
  t1.style.marginLeft = px(D.t1ml); t1.style.marginTop = px(D.t1mt);
  const t2 = $('t2');
  t2.style.fontSize = px(D.t2px); t2.style.lineHeight = 1; t2.style.marginTop = px(D.t2mt); t2.style.marginLeft = px(D.t2ml);
  $('dash').style.marginTop = px(D.dashMt);
  const sub = $('sub'); sub.style.fontSize = px(D.subpx); sub.style.lineHeight = 1.2; sub.style.marginTop = px(D.subMt);
  $('epi').textContent = '#' + String(D.number).padStart(2, '0');
  t1.textContent = D.t1;
  const m2 = /^(.*?)([？?])$/.exec(D.t2 || '');
  t2.innerHTML = '';
  t2.append(m2 ? m2[1] : (D.t2 || ''));
  if (m2) { const q = document.createElement('span'); q.className = 'q'; q.textContent = m2[2]; t2.append(q); }
  if (D.subHTML) sub.innerHTML = D.subHTML;

  // Shrink a line until it fits the receipt's content width (a 3-letter "API" at 456 px fits; "Token" won't).
  function fit(el, maxPx) {
    const avail = D.rw - 2 * D.pad - (parseFloat(el.style.marginLeft) || 0);
    const textW = () => { el.style.width = 'max-content'; const w = el.offsetWidth; el.style.width = ''; return w; };
    let size = maxPx;
    el.style.fontSize = px(size);
    while (textW() > avail && size > 40) { size -= 4; el.style.fontSize = px(size); }
    return size;
  }
  function layout() {
    frameBg();
    const s1 = fit(t1, D.t1px);
    if (s1 < D.t1px) t1.style.marginTop = px(D.t1mt + (D.t1px - s1) * 0.25);   // keep the block visually centred
    fit(t2, D.t2px);
    fit(sub, D.subpx);
    // A shrunken title leaves blank paper at the bottom: tear the receipt off shorter instead.
    const bottom = c.offsetTop + c.offsetHeight + 84;
    if (bottom < D.rh) r.style.height = px(Math.max(620, bottom));
  }
  const decoded = (im) => (im.decode ? im.decode().catch(() => {}) : Promise.resolve());
  Promise.all([document.fonts.ready, decoded(b), decoded($('ryo'))]).then(() => { layout(); window.__READY__ = true; });

  // ---- paper grain (seeded, static)
  const cv = $('paperGrain'), cx = cv.getContext('2d');
  const img = cx.createImageData(cv.width, cv.height), d = img.data, rnd = mulberry32(7);
  for (let i = 0; i < d.length; i += 4) { const v = rnd(); d[i] = d[i + 1] = d[i + 2] = v < .5 ? 60 : 255; d[i + 3] = Math.round(Math.abs(v - .5) * 2 * 16); }
  cx.putImageData(img, 0, 0);

  // ---- torn zig-zag bottom edge
  const paper = $('paper'), shadow = $('receiptShadow');
  const PW = D.rw, TW = 28, TH = 14, n = Math.round(PW / TW), tw = PW / n;
  const pts = ['0 0', '100% 0', `100% calc(100% - ${TH}px)`];
  for (let i = n; i >= 0; i--) pts.push(`${(i * tw).toFixed(2)}px calc(100% - ${i % 2 ? 0 : TH}px)`);
  pts.push(`0 calc(100% - ${TH}px)`);
  paper.style.clipPath = shadow.style.clipPath = `polygon(${pts.join(',')})`;

  // ---- the presenter: integer scale, 1-sprite-pixel ink outline + 1-sprite-pixel paper outline (sticker style)
  const S = D.scale, FX = D.ryoX, FOOT = D.foot;
  const ryo = $('ryo');
  ryo.style.width = px(D.frame[0] * S); ryo.style.height = px(D.frame[1] * S);
  ryo.style.left = px(FX);
  ryo.style.top = px(FOOT - D.footRow * S);    // shoe soles sit on sprite row footRow (62)
  const ring = (col) => `drop-shadow(${S}px 0 0 ${col}) drop-shadow(-${S}px 0 0 ${col}) drop-shadow(0 ${S}px 0 ${col}) drop-shadow(0 -${S}px 0 ${col})`;
  // plus the same soft cast shadow the receipt has (light from upper-left), so both sit in one space
  ryo.style.filter = D.outline.map(ring).join(' ') + (D.plain ? ' drop-shadow(8px 14px 16px rgba(0,0,0,.2))' : ' drop-shadow(10px 20px 18px rgba(0,0,0,.55))');
  const sh = $('ryoShadow');
  sh.style.left = px(FX + D.shadow.x * S); sh.style.width = px(D.shadow.w * S);
  sh.style.top = px(FOOT + D.shadow.y * S); sh.style.height = px(D.shadow.h * S);
  const fl = $('floor');
  fl.style.left = px(FX + D.floor.x * S); fl.style.width = px(D.floor.w * S);
  fl.style.top = px(FOOT + D.floor.y * S); fl.style.height = px(D.floor.h * S);

  // ---- pixel "?" on the sprite grid (ink ring, then paper ring, same as the presenter)
  const Q = [
    '.####.',
    '##..##',
    '....##',
    '...##.',
    '..##..',
    '..##..',
    '......',
    '..##..',
    '..##..',
  ];
  const qc = $('qmark');
  if (D.q && D.q.on) {
    const rings = D.outline.length, h = Q.length, w = Q[0].length, P = rings;
    qc.width = w + 2 * P; qc.height = h + 2 * P;
    const g = qc.getContext('2d');
    let mask = Array.from({ length: qc.height }, (_, y) => Array.from({ length: qc.width }, (_, x) => {
      const r0 = y - P, k0 = x - P; return r0 >= 0 && r0 < h && k0 >= 0 && k0 < w && Q[r0][k0] === '#';
    }));
    const layers = [mask];
    for (let i = 0; i < rings; i++) {
      const m = layers[layers.length - 1];
      layers.push(m.map((row, y) => row.map((_, x) => {
        for (let dy = -1; dy <= 1; dy++) for (let dx = -1; dx <= 1; dx++) { const yy = y + dy, xx = x + dx; if (m[yy] && m[yy][xx]) return true; }
        return false;
      })));
    }
    for (let i = rings; i >= 1; i--) {           // outermost ring first
      g.fillStyle = D.outline[i - 1];
      layers[i].forEach((row, y) => row.forEach((on, x) => { if (on) g.fillRect(x, y, 1, 1); }));
    }
    g.fillStyle = D.q.fill;
    layers[0].forEach((row, y) => row.forEach((on, x) => { if (on) g.fillRect(x, y, 1, 1); }));
    qc.style.width = px(qc.width * S); qc.style.height = px(qc.height * S);
    qc.style.left = px(D.q.sx != null ? FX + D.q.sx * S : D.q.x);
    qc.style.top = px(D.q.sy != null ? FOOT - D.footRow * S + D.q.sy * S : D.q.y);
  } else { qc.style.display = 'none'; }
})();
</script>
</body>
</html>
