<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<!-- 《Claude Code 能装模组了！官方这几天发的新东西，一个视频讲完》整片：2340×1080，30 fps，白底。
     renderAt(t) 画出第 t 秒（同一个 t 永远是同一帧）。数据：timeline.js（build_timeline.py）、frames.js（prep_frames.py）。
     版式沿用《白宫超级智能协定》那条（全程画外音，不放出镜框——用户 2026-10-01 定的规矩）：左栏目录，右边演示区 1636×920
     （内容按 1474×829 写，整体 scale 1.1099），字幕在 y 966 以下；演示区放“卡片”或“@ClaudeDevs 的官方演示视频”。
     脚本：scenes.js（卡片、叠加层）→ engine.js（renderAt）。 -->
<link rel="stylesheet" href="file:///D:/大疆/AI科普/素材/字体/fonts.css">
<style>
:root { --ink:#1B1B1F; --ink2:#374151; --gray:#6B7280; --gray2:#9AA1AC; --line:#E5E7EB; --soft:#F4F5F7; --orange:#FF4F1A; --marker:#FFD84D; --green:#16A34A; --blue:#2563EB; --red:#E11D48; --cyan:#0891B2; --magenta:#C026D3; --yellow:#CA8A04; }
* { box-sizing:border-box; margin:0; padding:0; }
html, body { width:2340px; height:1080px; background:#fff; overflow:hidden; font-family:'Noto Sans SC', sans-serif; color:var(--ink); }
.abs { position:absolute; }
.frame { position:absolute; background:#fff; padding:14px; border:1px solid var(--line); border-radius:10px; box-shadow:0 14px 36px rgba(0,0,0,.14); }
.frame .inner { position:relative; width:100%; height:100%; border-radius:4px; overflow:hidden; background:#EEF0F3; }
.tape { position:absolute; width:150px; height:40px; background:rgba(255,214,140,.8); top:-18px; box-shadow:0 1px 2px rgba(0,0,0,.08); z-index:3; }
.tape.l { left:44px; transform:rotate(-7deg); } .tape.r { right:44px; transform:rotate(6deg); }
.chip { display:inline-block; padding:5px 18px; border:3px solid var(--orange); color:var(--orange); border-radius:999px; font:800 26px 'Noto Sans SC'; white-space:nowrap; }
.chip.fill { background:var(--orange); color:#fff; }
.chip.ink { border-color:var(--ink); color:var(--ink); background:#fff; }
.chip.blue { border-color:var(--blue); color:var(--blue); background:#fff; }
.chip.red { border-color:var(--red); color:var(--red); background:#fff; }
.chip.green { border-color:var(--green); color:var(--green); background:#fff; }
.mark { background:linear-gradient(transparent 58%, var(--marker) 58%, var(--marker) 92%, transparent 92%); }

/* 目录 */
#toc { position:absolute; left:40px; top:352px; width:560px; padding:30px 32px 24px; background:rgba(255,255,255,.96); border-top:3px solid var(--orange); border-left:1px solid #E6E6E6; border-right:1px solid #E6E6E6; border-bottom:1px solid #E6E6E6; box-shadow:0 6px 18px rgba(0,0,0,.08); }
#toc .t { font:800 34px 'Noto Sans SC'; margin-bottom:22px; white-space:nowrap; }
#toc .t span { display:block; font:600 22px 'Noto Sans SC'; color:var(--gray2); margin:6px 0 0 0; }
#toc .it { display:flex; align-items:center; gap:12px; font:500 30px/2.1 'Noto Sans SC'; color:#B0B6BF; white-space:nowrap; }
#toc .it .b { width:6px; height:28px; border-radius:3px; background:transparent; flex:none; }
#toc .it .n { font:700 22px 'Space Grotesk'; width:24px; flex:none; }
#toc .it.done { color:var(--gray); }
#toc .it.now { color:var(--ink); font-weight:800; }
#toc .it.now .b { background:var(--orange); }

/* 演示区 */
#demo { left:636px; top:18px; width:1664px; height:948px; }
#demoin { position:absolute; left:0; top:0; width:1474px; height:829px; transform-origin:0 0; transform:scale(1.10990); }
#cardbg { position:absolute; inset:0; background:linear-gradient(160deg, #F6F7F9 0%, #E7EBF0 100%); }
#scrimg { position:absolute; left:0; top:0; width:100%; height:100%; display:block; visibility:hidden; background:#000; }
/* 官方演示视频底部的英文说明条（原图 y 931 起，演示区坐标 715 起，#FAF8F4）：用同色条盖住，换成中文 */
#capbar { position:absolute; left:0; top:713px; width:1474px; height:116px; background:#FAF8F4; z-index:4; display:none; align-items:center; padding:0 56px; gap:28px; }
#capbar .nm { font:800 42px 'Noto Sans SC'; color:#111; white-space:nowrap; }
#capbar .bar { width:3px; height:46px; background:#D4795A; flex:none; }
#capbar .zh { font:600 38px 'Noto Sans SC'; color:#1B1B1F; white-space:nowrap; }
#capbar .no { margin-left:auto; font:800 26px 'Noto Sans SC'; color:#D4795A; white-space:nowrap; }
#ovB { position:absolute; inset:0; z-index:6; }
.chapchip { position:absolute; left:22px; top:20px; background:var(--orange); color:#fff; font:800 30px 'Noto Sans SC'; padding:8px 22px; border-radius:12px; white-space:nowrap; box-shadow:0 8px 20px rgba(0,0,0,.25); z-index:5; }
.chapchip span { font:700 24px 'Space Grotesk'; opacity:.85; margin-right:12px; }
.credit { position:absolute; right:22px; top:20px; background:rgba(17,17,17,.84); color:#fff; font:700 26px 'Noto Sans SC'; padding:8px 20px; border-radius:12px; white-space:nowrap; z-index:5; }
.tagpill { position:absolute; background:rgba(255,255,255,.94); color:var(--ink); font:800 30px 'Noto Sans SC'; padding:8px 22px; border-radius:12px; white-space:nowrap; box-shadow:0 8px 20px rgba(0,0,0,.25); z-index:5; border-left:8px solid var(--orange); }
.bigpill { display:inline-block; background:rgba(17,17,17,.88); color:#fff; font:900 66px/1.2 'Noto Sans SC'; padding:10px 40px 14px; border-radius:22px; box-shadow:0 14px 34px rgba(0,0,0,.28); white-space:nowrap; }
.bigpill em { font-style:normal; color:var(--marker); }

/* 卡片 */
.kick { font:700 26px 'Noto Sans SC'; letter-spacing:.2em; color:var(--orange); white-space:nowrap; }
.big { font:800 92px/1.15 'Noto Sans SC'; white-space:nowrap; }
.h1 { font:800 60px/1.25 'Noto Sans SC'; white-space:nowrap; }
.h2 { font:800 46px/1.3 'Noto Sans SC'; white-space:nowrap; }
.cap { position:absolute; font:700 28px/1.45 'Noto Sans SC'; color:var(--gray); }
.tile { position:absolute; border-radius:20px; background:#fff; border:3px solid var(--line); box-shadow:0 12px 28px rgba(0,0,0,.08); padding:22px 28px; }
.tile .tt { font:800 44px/1.25 'Noto Sans SC'; white-space:nowrap; }
.tile .en { font:600 24px/1.3 'JetBrains Mono','Noto Sans SC'; color:var(--gray2); margin-top:4px; white-space:nowrap; }
.tile .dd { font:600 28px/1.5 'Noto Sans SC'; color:var(--gray); margin-top:10px; }
.tile .dd b { color:var(--ink); }
.tile.hot { border-color:var(--orange); }
.tile .no { display:inline-flex; align-items:center; justify-content:center; width:56px; height:56px; border-radius:50%; background:var(--ink); color:#fff; font:800 30px 'Space Grotesk'; margin-right:16px; vertical-align:middle; }
.tile.hot .no { background:var(--orange); }
.kbd { display:inline-block; min-width:54px; text-align:center; padding:2px 16px 4px; border:3px solid var(--ink); border-bottom-width:7px; border-radius:12px; background:#fff; font:800 34px 'JetBrains Mono','Noto Sans SC'; }
.cmd { display:inline-block; padding:10px 26px; border-radius:14px; background:#16181D; color:#F3F4F6; font:600 38px/1.3 'JetBrains Mono','Noto Sans SC'; white-space:nowrap; box-shadow:0 10px 24px rgba(0,0,0,.22); }
.cmd .p { color:#FDBA74; } .cmd .g { color:#86EFAC; } .cmd .d { color:#9CA3AF; } .cmd .b { color:#93C5FD; }
.term { position:absolute; border-radius:18px; background:#16181D; color:#E5E7EB; font:500 28px/1.6 'JetBrains Mono','Noto Sans SC'; padding:24px 32px; box-shadow:0 14px 30px rgba(0,0,0,.25); overflow:hidden; white-space:pre; }
.term .c { color:#8B93A1; } .term .k { color:#C4B5FD; } .term .s { color:#86EFAC; } .term .f { color:#FDBA74; } .term .y { color:#FCD34D; } .term .r { color:#FCA5A5; }
.stamp { position:absolute; padding:8px 28px; border:7px solid var(--red); color:var(--red); border-radius:14px; font:900 54px 'Noto Sans SC'; letter-spacing:.08em; transform:rotate(-8deg); background:rgba(255,255,255,.55); white-space:nowrap; }
.stamp.o { border-color:var(--orange); color:var(--orange); }
.stamp.g { border-color:var(--green); color:var(--green); }
.banner { position:absolute; left:70px; width:1334px; border-radius:20px; padding:20px 36px; text-align:center; font:900 56px/1.3 'Noto Sans SC'; background:var(--ink); color:#fff; box-shadow:0 12px 28px rgba(0,0,0,.2); white-space:nowrap; }
.banner em { font-style:normal; color:var(--marker); }
.lvl { display:flex; align-items:center; gap:14px; height:62px; padding:0 18px; border-radius:14px; background:rgba(255,255,255,.95); box-shadow:0 8px 18px rgba(0,0,0,.28); font:800 28px 'Noto Sans SC'; white-space:nowrap; }
.lvl i { flex:none; width:22px; height:22px; border-radius:50%; }
.lvl small { margin-left:auto; font:700 24px 'JetBrains Mono'; color:var(--gray); }

/* 字幕 */
#subs { position:absolute; left:0; top:966px; width:2340px; height:110px; z-index:30; pointer-events:none; }
#subZh { position:absolute; left:0; right:0; top:10px; text-align:center; font:800 52px/66px 'Noto Sans SC'; color:var(--ink); -webkit-text-stroke:10px #fff; paint-order:stroke fill; white-space:nowrap; }
</style>
</head>
<body>
<div class="frame" id="demo"><div class="tape l"></div><div class="tape r"></div>
  <div class="inner"><div id="demoin">
    <div id="cardbg"></div>
    <img id="scrimg">
    <div id="capbar"><span class="nm"></span><span class="bar"></span><span class="zh"></span><span class="no"></span></div>
    <div id="ovB"></div>
  </div></div>
</div>
<div id="toc"></div>
<div id="subs"><div id="subZh"></div></div>
<script src="timeline.js"></script>
<script src="frames.js"></script>
<script src="pages.js"></script>
<script src="scenes.js"></script>
<script src="engine.js"></script>
</body>
</html>
