<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<!-- 教程《如何使用 Claude 来低成本地生成视频》整片（2340×1080，30 fps，无字幕版）。
     renderAt(t) 画出第 t 秒：同一个 t 永远是同一帧。时间轴在 timeline.js（build_timeline.py 生成），数据在 data.js（prep_media.py 生成）。
     版式：A = 出镜大框在左、右边写要点；B = 出镜缩到左上角、左下是本章目录、右边大区域放演示；C = 作品展示。
     字幕带（y 930 以下）先空着，配音录好后再加。 -->
<link rel="stylesheet" href="file:///D:/大疆/AI科普/素材/字体/fonts.css">
<style>
:root { --ink:#1B1B1F; --ink2:#374151; --gray:#6B7280; --gray2:#9AA1AC; --line:#E5E7EB; --soft:#F4F5F7; --orange:#FF4F1A; --marker:#FFD84D; --green:#16A34A; --red:#DC2626; }
* { box-sizing:border-box; margin:0; padding:0; }
html, body { width:2340px; height:1080px; background:#fff; overflow:hidden; font-family:'Noto Sans SC', sans-serif; color:var(--ink); }
#stage, .root { position:absolute; inset:0; }
.abs { position:absolute; }
.frame { position:absolute; background:#fff; padding:14px; border:1px solid var(--line); border-radius:10px; box-shadow:0 14px 36px rgba(0,0,0,.14); }
.frame .inner { position:relative; width:100%; height:100%; border-radius:4px; overflow:hidden; background:#EEF0F3; }
.frame .inner > img { position:absolute; left:0; top:0; width:100%; height:100%; object-fit:cover; display:block; }
.tape { position:absolute; width:150px; height:40px; background:rgba(255,214,140,.8); top:-18px; box-shadow:0 1px 2px rgba(0,0,0,.08); z-index:3; }
.tape.l { left:44px; transform:rotate(-7deg); }
.tape.r { right:44px; transform:rotate(6deg); }
.tape.s { width:110px; height:32px; top:-15px; }
.card { position:absolute; background:var(--soft); border-radius:14px; }
.wcard { position:absolute; background:#fff; border:1px solid var(--line); border-radius:14px; box-shadow:0 8px 24px rgba(0,0,0,.08); }
.chip { display:inline-block; padding:5px 18px; border:3px solid var(--orange); color:var(--orange); border-radius:999px; font:800 26px 'Noto Sans SC'; white-space:nowrap; }
.h1 { font:800 52px/1.25 'Noto Sans SC'; white-space:nowrap; }
.big { font:800 84px/1.22 'Noto Sans SC'; }
.mark { background:linear-gradient(transparent 58%, var(--marker) 58%, var(--marker) 92%, transparent 92%); }
.note { position:absolute; font:500 22px 'Noto Sans SC'; color:var(--gray2); white-space:nowrap; }
.mono { font-family:'JetBrains Mono','Noto Sans SC', monospace; }
.code { position:absolute; background:#1E1F22; color:#D4D4D4; border-radius:14px; padding:30px 36px; font:500 28px/1.7 'JetBrains Mono','Noto Sans SC', monospace; white-space:pre; overflow:hidden; box-shadow:0 14px 36px rgba(0,0,0,.18); }
.code .k { color:#C792EA; } .code .s { color:#C3E88D; } .code .c { color:#7F848E; } .code .n { color:#F78C6C; } .code .f { color:#82AAFF; }
.caret { display:inline-block; width:14px; height:30px; background:var(--orange); vertical-align:-5px; }
.sprite { position:absolute; image-rendering:pixelated; }
.num { display:inline-flex; width:52px; height:52px; border-radius:50%; background:var(--orange); color:#fff; font:800 30px 'Space Grotesk'; align-items:center; justify-content:center; flex:none; }
.bl { display:flex; align-items:center; gap:22px; font:700 44px/1.3 'Noto Sans SC'; }
.hl { position:absolute; border:5px solid var(--orange); border-radius:12px; box-shadow:0 0 0 4px rgba(255,79,26,.18); }
.lab { position:absolute; background:var(--orange); color:#fff; font:800 26px 'Noto Sans SC'; padding:4px 14px; border-radius:8px; white-space:nowrap; }
.row { display:flex; align-items:center; }
.tag0 { display:inline-block; background:#E8F7EE; color:var(--green); border-radius:8px; padding:2px 14px; font:800 30px 'Space Grotesk','Noto Sans SC'; }
/* 左下目录 */
#toc { left:48px; top:492px; width:696px; height:408px; padding:26px 30px; }
#toc .t { font:800 30px 'Noto Sans SC'; margin-bottom:14px; white-space:nowrap; }
#toc .it { display:flex; align-items:center; gap:12px; font:500 24px/1.42 'Noto Sans SC'; color:#B0B6BF; white-space:nowrap; }
#toc .it .b { width:6px; height:26px; border-radius:3px; background:transparent; flex:none; }
#toc .it.done { color:var(--gray); }
#toc .it.now { color:var(--ink); font-weight:800; }
#toc .it.now .b { background:var(--orange); }
/* 出镜位（占位） */
#cam { z-index:10; }
#cam .inner { display:flex; flex-direction:column; align-items:center; justify-content:center; gap:.3em; }
#cam .t1 { font-weight:800; color:#6B7280; font-size:1em; }
#cam .t2 { font-weight:600; color:#9AA1AC; font-size:.62em; }
#cam .pid { position:absolute; right:.5em; bottom:.4em; font:800 .6em 'Space Grotesk'; color:#9AA1AC; }
</style>
</head>
<body>
<div id="stage"></div>
<div class="card" id="toc"></div>
<div class="frame" id="cam">
  <div class="tape l s"></div><div class="tape r s"></div>
  <div class="inner">
    <svg viewBox="0 0 100 100" style="width:4.2em;height:4.2em"><circle cx="50" cy="36" r="18" fill="#C9CED6"/><path d="M16 94c0-19 15-31 34-31s34 12 34 31z" fill="#C9CED6"/></svg>
    <div class="t1">UE 出镜位</div>
    <div class="t2">自拍之后合成进来</div>
    <div class="pid" id="campid"></div>
  </div>
</div>
<script src="timeline.js"></script>
<script src="data.js"></script>
<script>
// ======================================================================= 基础
const TLD = window.TL, D = window.DATA, FPS = TLD.fps;
const SX = 790, SY = 40, SW = 1502, SB = 900;           // 版式 B 的演示区（下沿 900，下面留给字幕）
const RX = 1400, RW = 880;                             // 版式 A 的右侧要点区
const CAM = { A: { x: 120, y: 150, w: 1156, h: 666 }, P: { x: 48, y: 48, w: 696, h: 402 } };
const MOVE = 0.7, FIN = 0.45, FOUT = 0.3;
const WH = 'file:///D:/大疆/AI科普/素材/角色/大肥鱼像素素材包/素材/动作帧';
const SHOW = '../01_作品展示/clips';
window.__ERR = [];

const clamp = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x));
const easeOut = x => 1 - Math.pow(1 - clamp(x), 3);
const easeIn = x => Math.pow(clamp(x), 3);
const easeIO = x => { x = clamp(x); return x < .5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2; };
const lerp = (a, b, x) => a + (b - a) * x;
const px = v => v + 'px';
const pad3 = n => String(n).padStart(3, '0');
const PARA = {}; TLD.paras.forEach(p => PARA[p.id] = p);

function units(text) {   // 和 build_timeline.py 的 units() 一样
  let u = 0;
  for (const m of text.matchAll(/[A-Za-z][A-Za-z\-]*|\d|[\u4e00-\u9fff]|[，、：；]|[。？！]/g)) {
    const s = m[0];
    if (/^[A-Za-z]/.test(s)) u += 1.5; else if (/^\d$/.test(s)) u += 1.1;
    else if ('，、：；'.includes(s)) u += 0.9; else if ('。？！'.includes(s)) u += 1.6; else u += 1;
  }
  return u;
}
function timer(s) {
  return {
    dur: s.end - s.start,
    p0: pid => PARA[pid].start - s.start,
    pe: pid => PARA[pid].start - s.start + PARA[pid].speech,
    at(pid, phrase, off = 0) {
      const p = PARA[pid], i = p.text.indexOf(phrase);
      if (i < 0) throw new Error(`「${phrase}」不在 ${pid}`);
      return p.start - s.start + units(p.text.slice(0, i)) / units(p.text) * p.speech + off;
    },
  };
}

function mk(parent, cls = '', style = {}, html = '', tag = 'div') {
  const e = document.createElement(tag);
  if (cls) e.className = cls;
  for (const [k, v] of Object.entries(style)) if (v !== undefined && v !== null) e.style[k] = typeof v === 'number' && !['opacity', 'zIndex', 'fontWeight', 'lineHeight', 'flex'].includes(k) ? px(v) : v;
  if (html) e.innerHTML = html;
  parent.appendChild(e);
  return e;
}
const at = (parent, x, y, w, h, cls = '', style = {}, html = '') => mk(parent, 'abs ' + cls, Object.assign({ left: x, top: y, width: w, height: h }, style), html);

// 出现 / 消失：t0 开始淡入，t1（可选）开始淡出
function show(el, lt, t0, o = {}) {
  const d = o.d ?? 0.4, dy = o.dy ?? 18, dx = o.dx ?? 0;
  const a = easeOut((lt - t0) / d);
  const b = o.t1 == null ? 1 : 1 - easeIn((lt - o.t1) / (o.d1 ?? 0.3));
  const v = Math.min(a, b);
  el.style.opacity = v;
  el.style.visibility = v < 0.002 ? 'hidden' : 'visible';
  el.style.transform = `translate(${dx * (1 - a)}px, ${dy * (1 - a)}px)` + (o.scale ? ` scale(${lerp(o.scale, 1, a)})` : '');
  return v;
}

const PENDING = new Set();
function setSrc(img, src) {
  if (img.dataset.src !== src) { img.dataset.src = src; img.src = src; PENDING.add(img); }
}
function image(parent, src, style = {}) { const i = mk(parent, '', style, '', 'img'); setSrc(i, src); return i; }
async function flush() {
  const arr = [...PENDING]; PENDING.clear();
  await Promise.all(arr.map(i => i.decode().catch(() => window.__ERR.push('图片加载失败 ' + i.dataset.src))));
}
function seqSrc(dir, n, lt, t0, fps = FPS) {
  const i = clamp(Math.floor((lt - t0) * fps), 0, n - 1);
  return `${dir}/f_${pad3(i + 1)}.jpg`;
}
// 带胶带的画框，返回 inner
function frameBox(parent, x, y, w, h, tape = true) {
  const f = at(parent, x, y, w, h, 'frame');
  if (tape) { mk(f, 'tape l'); mk(f, 'tape r'); }
  const inner = mk(f, 'inner');
  return { f, inner };
}
// 顶部标题：chip + 大标题
function header(root, chip, title) {
  const h = at(root, SX, SY + 6, SW, 130);
  mk(h, 'chip', {}, chip);
  mk(h, 'h1', { marginTop: 14 }, title);
  return h;
}

// 像素角色：12 帧呼吸（毫秒）
const BREATH = [600, 140, 400, 140, 140, 520, 140, 60, 150, 70, 140, 140], BSUM = 2640;
function breathIdx(ms) { let m = ((ms % BSUM) + BSUM) % BSUM; for (let i = 0; i < 12; i++) { if (m < BREATH[i]) return i; m -= BREATH[i]; } return 11; }
function sprite(parent, x, y, scale) { return mk(parent, 'sprite', { left: x, top: y, width: 64 * scale, height: 64 * scale }, '', 'img'); }
function setSprite(img, key, lt) { setSrc(img, `${WH}/${key}/${String(breathIdx(lt * 1000)).padStart(2, '0')}.png`); }

// ======================================================================= 画面
const S = {};

// ---- S01 开场标题（A）
S.intro = (root, s) => {
  const tm = timer(s);
  const box = at(root, RX, 190, RW, 600);
  const c = mk(box, 'chip', {}, 'Claude 做视频 · 教程');
  const t = mk(box, 'big', { marginTop: 30 }, '如何用 Claude<br><span class="mark" id="mk1">低成本</span>地生成视频');
  const sub = mk(box, '', { marginTop: 34, font: "500 32px/1.6 'Noto Sans SC'", color: 'var(--gray)' }, 'Opus 5.5 · 写代码做视频<br>原理 · 拆解 · 成本');
  return { update(lt) { show(c, lt, 0.3); show(t, lt, 0.5); show(sub, lt, 1.1); } };
};

// ---- S02 Opus 5.5 发布：智能指数 + 价格
S.opus55 = (root, s) => {
  const tm = timer(s), tB = tm.p0('P02b');
  const h = header(root, '9 月 22 日', 'Claude Opus 5.5 发布');
  const chart = at(root, SX, 190, SW, 640);
  mk(chart, '', { font: "700 30px 'Noto Sans SC'", color: 'var(--ink2)' }, 'Artificial Analysis 智能指数（截至 9 月 28 日）');
  const rows = [['Claude Opus 5.5', 57.6], ['Claude Fable 5.1', 53.4], ['GPT-6 Astra', 52.7], ['Muse Spark 1.3', 48.1], ['GPT-6 Sol', 47.5], ['Grok 4.7', 46.4], ['MiMo-V2.6-Pro', 46.3]];
  const bars = rows.map(([name, v], i) => {
    const y = 70 + i * 72;
    mk(chart, 'abs', { left: 0, top: y, width: 330, textAlign: 'right', font: `${i ? 600 : 800} 30px 'Noto Sans SC'`, color: i ? 'var(--ink2)' : 'var(--ink)' }, name);
    const bar = mk(chart, 'abs', { left: 360, top: y + 4, height: 44, width: 0, borderRadius: 8, background: i ? '#C9CED6' : 'var(--orange)' });
    const val = mk(chart, 'abs', { left: 360, top: y + 2, font: `800 32px 'Space Grotesk'`, color: i ? 'var(--gray)' : 'var(--orange)' }, v.toFixed(1));
    return { bar, val, v };
  });
  const lead = mk(chart, 'abs', { left: 1250, top: 60, font: "800 34px 'Noto Sans SC'", color: 'var(--orange)' }, '领先第二名 4.2 分');
  const src1 = at(root, SX, 846, SW, 40, 'note', {}, '来源：Artificial Analysis 智能指数 v4.3.2，按模型计，2026-09-28');
  // 价格
  const price = at(root, SX, 190, SW, 640);
  const col = (x, name, val, dim) => {
    const c = mk(price, 'wcard', { left: x, top: 60, width: 560, height: 330, padding: '34px 40px' });
    mk(c, '', { font: "700 34px 'Noto Sans SC'", color: dim ? 'var(--gray)' : 'var(--ink)' }, name);
    mk(c, '', { font: "800 92px/1.3 'Space Grotesk'", color: dim ? '#B0B6BF' : 'var(--orange)', marginTop: 20, textDecoration: dim ? 'line-through' : 'none' }, val);
    mk(c, '', { font: "500 26px 'Noto Sans SC'", color: 'var(--gray)', marginTop: 10 }, '每百万 token · 输入 / 输出');
    return c;
  };
  const c5 = col(0, 'Claude Opus 5', '$5 / $25', true);
  const arrow = mk(price, 'abs', { left: 590, top: 170, font: "800 80px 'Noto Sans SC'", color: 'var(--gray2)' }, '→');
  const c55 = col(700, 'Claude Opus 5.5', '$4 / $20', false);
  const badge = mk(price, 'abs', { left: 1290, top: 80, width: 200, height: 200, borderRadius: '50%', background: 'var(--orange)', color: '#fff', display: 'flex', alignItems: 'center', justifyContent: 'center', font: "800 60px 'Space Grotesk'", transformOrigin: 'center' }, '−20%');
  const line40 = mk(price, 'abs', { left: 0, top: 440, width: SW, font: "700 40px 'Noto Sans SC'" }, '官方：常见任务整体跑下来，比 Opus 5 省 <span class="mark">40%</span>');
  const src2 = at(root, SX, 846, SW, 40, 'note', {}, '来源：Anthropic 官方价格页、Opus 5.5 发布页（2026-09-22）');
  const tBars = tm.at('P02a', '在 Artificial');
  return {
    update(lt) {
      show(h, lt, 0.2);
      const v1 = show(chart, lt, 0.5, { t1: tB - 0.4 });
      show(src1, lt, 0.8, { t1: tB - 0.4 });
      bars.forEach((b, i) => {
        const g = easeOut((lt - tBars - i * 0.08) / 1.2);
        b.bar.style.width = px(g * b.v / 60 * 860);
        b.val.style.left = px(360 + g * b.v / 60 * 860 + 18);
        b.val.style.opacity = g;
      });
      show(lead, lt, tm.at('P02a', '比第二名'), { t1: tB - 0.4 });
      show(price, lt, tB);
      show(c5, lt, tB + 0.1); show(arrow, lt, tB + 0.5, { dx: -20, dy: 0 }); show(c55, lt, tB + 0.7);
      show(badge, lt, tm.at('P02b', '便宜了'), { scale: 0.6 });
      show(line40, lt, tm.at('P02b', '官方还说'));
      show(src2, lt, tB + 0.3);
    },
  };
};

// ---- S03 视觉：GPT-6 建模 + Opus 5.5 视觉
S.vision = (root, s) => {
  const tm = timer(s), tB = tm.p0('P03b'), tG = tm.at('P03a', 'GPT-6 Astra') - 0.3;
  const h = header(root, '视觉能力', 'Opus 5.5 的视觉也强了一大截');
  const fb = frameBox(root, SX + 137, 196, 1228, 703);          // 内框 1200×675，不压标题、不进字幕带
  const img = image(fb.inner, `media/gpt6/f_001.jpg`);
  const cap = mk(fb.inner, 'abs', { left: 16, bottom: 14, zIndex: 2 }, '<span class="lab" style="position:static">GPT-6 Astra · 在 Blender 里建模 ｜ 视频来源：待补</span>');
  const src1 = cap;
  // Opus 5.5
  const box = at(root, SX, 190, SW, 680);
  const card = mk(box, 'wcard', { left: 0, top: 0, width: SW, height: 250, padding: '36px 44px' });
  mk(card, '', { font: "800 46px/1.3 'Noto Sans SC'" }, 'Opus 5.5：视觉和电脑操作最强的 Opus');
  mk(card, '', { font: "500 28px 'Noto Sans SC'", color: 'var(--gray)', marginTop: 14 }, 'Anthropic 官方说法（Opus 5.5 发布页）');
  const tags = ['图表', '截图', '示意图'].map((t, i) => mk(box, 'abs', { left: i * 330, top: 300, width: 300, height: 120, borderRadius: 14, background: 'var(--soft)', display: 'flex', alignItems: 'center', justifyContent: 'center', font: "800 44px 'Noto Sans SC'" }, t));
  const bench = mk(box, 'abs', { left: 0, top: 470, width: SW, height: 200 });
  mk(bench, '', { font: "700 28px 'Noto Sans SC'", color: 'var(--ink2)' }, 'OSWorld 2.0（看截图操作电脑）');
  const b1 = mk(bench, 'abs', { left: 0, top: 56, height: 44, borderRadius: 8, background: 'var(--orange)', width: 0 });
  const b2 = mk(bench, 'abs', { left: 0, top: 118, height: 44, borderRadius: 8, background: '#C9CED6', width: 0 });
  const l1 = mk(bench, 'abs', { top: 58, font: "800 32px 'Space Grotesk','Noto Sans SC'", color: 'var(--orange)' }, 'Opus 5.5　81.8%');
  const l2 = mk(bench, 'abs', { top: 120, font: "800 32px 'Space Grotesk','Noto Sans SC'", color: 'var(--gray)' }, 'Opus 5　74.0%');
  const src2 = at(root, SX, 884, SW, 30, 'note', {}, '来源：anthropic.com/claude-opus-5-5');
  const tTags = [tm.at('P03b', '图表'), tm.at('P03b', '截图'), tm.at('P03b', '示意图')];
  return {
    update(lt) {
      show(h, lt, 0.2);
      show(fb.f, lt, tG, { t1: tB - 0.4, scale: 0.97 });
      show(cap, lt, tG + 0.2, { t1: tB - 0.4 });
      show(src1, lt, tG + 0.2, { t1: tB - 0.4 });
      setSrc(img, seqSrc('media/gpt6', 300, lt, tG + 0.3));
      show(box, lt, tB);
      tags.forEach((e, i) => show(e, lt, tTags[i]));
      show(bench, lt, tB + 1.0);
      const g = easeOut((lt - tB - 1.3) / 1.2);
      b1.style.width = px(g * 81.8 / 100 * 1100); b2.style.width = px(g * 74.0 / 100 * 1100);
      l1.style.left = px(g * 81.8 / 100 * 1100 + 20); l2.style.left = px(g * 74.0 / 100 * 1100 + 20);
      l1.style.opacity = g; l2.style.opacity = g;
      show(src2, lt, tB + 0.3);
    },
  };
};

// ---- S04 Claude 不能直接出图，它写代码
S.noimage = (root, s) => {
  const tm = timer(s), tQ = tm.at('P04', '那它怎么画画'), tC = tm.at('P04', '它写代码');
  const h = header(root, '官方文档', 'Claude 只负责看图、理解图');
  const q = at(root, SX, 200, SW, 330, 'wcard', { padding: '36px 44px' });
  mk(q, '', { font: "700 30px/1.5 'Noto Sans SC'", color: 'var(--gray)' }, 'Can Claude generate or edit images?');
  mk(q, '', { font: "600 34px/1.5 'Noto Sans SC'", marginTop: 10 }, '“No, Claude is an image understanding model only. It can interpret and analyze images, but it cannot generate, produce, edit, manipulate, or create images.”');
  mk(q, '', { font: "500 24px 'Noto Sans SC'", color: 'var(--gray2)', marginTop: 16 }, 'platform.claude.com/docs · Vision · FAQ');
  const cn = at(root, SX, 560, SW, 60, '', { font: "800 42px 'Noto Sans SC'" }, '→ Claude <span class="mark">不能直接生成图片</span>');
  const ask = at(root, SX, 660, 700, 80, '', { font: "800 56px 'Noto Sans SC'", color: 'var(--gray)' }, '那它怎么画画？');
  const ans = at(root, SX, 750, 700, 110, '', { font: "800 80px 'Noto Sans SC'", color: 'var(--orange)' }, '它写代码。');
  const code = at(root, SX + 760, 630, 742, 260, 'code');
  const CODE = "LOOK_R = Part('eyes:look_r', [\n  \".OwEEEO....OwEEEO.\",\n  \".OwBBBO....OwBBBO.\",\n  \"..OOO........OOO..\",\n])";
  return {
    update(lt) {
      show(h, lt, 0.2); show(q, lt, 0.6, { t1: tQ - 0.5 }); show(cn, lt, tm.at('P04', '它只负责'), { t1: tQ - 0.5 });
      // 问答上移到原来引文的位置
      show(ask, lt, tQ); show(ans, lt, tC, { scale: 0.8 });
      ask.style.top = px(lt > tQ - 0.5 ? 240 : 660); ans.style.top = px(lt > tQ - 0.5 ? 340 : 750);
      show(code, lt, tC + 0.2);
      const k = Math.round(CODE.length * clamp((lt - tC - 0.3) / 2.0));
      code.innerHTML = CODE.slice(0, k).replace(/</g, '&lt;') + (k < CODE.length ? '<span class="caret"></span>' : '');
      code.style.top = px(lt > tQ - 0.5 ? 240 : 630);

// ---- S08 扩散模型：噪点一步步去噪
S.diffusion = async (root, s) => {
  const tm = timer(s);
  const h = header(root, '扩散模型', '从一片噪点开始，一步一步去噪');
  const chips = at(root, SX, 200, SW, 60, '', {}, ['Sora', 'Veo', '可灵'].map(n => `<span class="chip" style="margin-right:16px;border-color:#C9CED6;color:var(--ink2)">${n}</span>`).join(''));
  const src = new Image(); src.src = 'media/gpt6_still.jpg'; await src.decode();
  const W = 270, H = 152, alphas = [1, 0.78, 0.55, 0.3, 0];
  const labels = ['随机噪点', '去噪', '去噪', '去噪', '每一帧的像素'];
  let seed = 20260928; const rnd = () => (seed = (seed * 1664525 + 1013904223) >>> 0) / 4294967296;
  const panels = alphas.map((a, i) => {
    const wrap = at(root, SX + i * 300, 330, W, H + 60);
    const cv = mk(wrap, '', { width: W, height: H, borderRadius: 10, boxShadow: '0 8px 20px rgba(0,0,0,.12)' }, '', 'canvas');
    cv.width = W; cv.height = H;
    // 本地图片会让画布不能读像素（getImageData 报跨域），所以另做一张噪点图，按比例叠在原图上面
    const g = cv.getContext('2d'); g.drawImage(src, 0, 0, W, H);
    const nz = document.createElement('canvas'); nz.width = W; nz.height = H;
    const ng = nz.getContext('2d'), d = ng.createImageData(W, H);
    for (let p = 0; p < d.data.length; p += 4) { d.data[p] = rnd() * 255; d.data[p + 1] = rnd() * 255; d.data[p + 2] = rnd() * 255; d.data[p + 3] = 255; }
    ng.putImageData(d, 0, 0);
    g.globalAlpha = a; g.drawImage(nz, 0, 0); g.globalAlpha = 1;
    mk(wrap, '', { marginTop: 14, textAlign: 'center', font: `${i === 4 ? 800 : 600} 26px 'Noto Sans SC'`, color: i === 4 ? 'var(--orange)' : 'var(--gray)' }, labels[i]);
    if (i < 4) mk(root, 'abs', { left: SX + i * 300 + W + 4, top: 330 + H / 2 - 24, font: "800 36px 'Noto Sans SC'", color: 'var(--gray2)' }, '›');
    return wrap;
  });
  const arrows = [...root.querySelectorAll('.abs')].filter(e => e.textContent === '›');
  const line = at(root, SX, 620, SW, 80, '', { font: "800 46px 'Noto Sans SC'" }, '→ 最后<span class="mark">直接画出每一帧的像素</span>');
  const t0 = tm.at('P08', '从一片'), t1 = tm.at('P08', '最后');
  return {
    update(lt) {
      show(h, lt, 0.2); show(chips, lt, tm.at('P08', 'Sora'));
      panels.forEach((p, i) => show(p, lt, t0 + (t1 - t0) * i / 4.5));
      arrows.forEach((a, i) => show(a, lt, t0 + (t1 - t0) * (i + 0.5) / 4.5, { dy: 0 }));
      show(line, lt, tm.at('P08', '直接画出'));
    },
  };
};

  let acc = 0; const SEG = CUTS.map(c => { const o = { u0: acc, u1: acc + c[0], s0: c[1], s1: c[2], cam: c[3], hl: c[4], note: c[5] }; acc += c[0]; return o; });

  const card = mk(box, 'wcard', { position: 'relative', marginTop: 34, padding: '30px 36px' }, `<div style="font:800 40px/1.5 'Noto Sans SC'">提示词 → <span class="mark">简介 ＋ 评论区置顶</span></div><div style="font:700 32px/1.6 'Noto Sans SC';color:var(--gray);margin-top:12px">直接复制去用<br>先从第一段开始，做一条 20 秒的小视频</div>`);
  const bye = mk(box, '', { font: "800 64px 'Noto Sans SC'", color: 'var(--orange)', marginTop: 34 }, '我们下期见');
  return { update(lt) { show(c, lt, 0.2); show(t1, lt, 0.3); show(card, lt, tm.p0('P39')); show(bye, lt, tm.p0('P40')); } };
};

// ======================================================================= 引擎
const stage = document.getElementById('stage'), tocEl = document.getElementById('toc'), camEl = document.getElementById('cam'), camPid = document.getElementById('campid');
let cur = null, tocChap = null;
const sceneIdx = t => { const sc = TLD.scenes; for (let i = sc.length - 1; i >= 0; i--) if (t >= sc[i].start - 1e-6) return i; return 0; };
const camRect = L => L === 'A' ? CAM.A : CAM.P;

function buildToc(s) {
  const ch = TLD.chapters[s.chapter];
  tocEl.innerHTML = `<div class="t">${ch.title}</div>` + ch.items.map((t, i) => `<div class="it" data-i="${i}"><span class="b"></span>${t}</div>`).join('');
  tocChap = s.chapter;
}

window.renderAt = async function (t) {
  const i = sceneIdx(t), s = TLD.scenes[i], prev = TLD.scenes[i - 1], next = TLD.scenes[i + 1];
  const lt = t - s.start, dur = s.end - s.start;
  if (!cur || cur.s !== s) {
    stage.innerHTML = '';
    const root = mk(stage, 'root');
    const api = await S[s.type](root, s);
    cur = { s, root, api };
  }
  // 出镜位：版式变化时移动 0.7 秒
  const a = prev ? camRect(prev.layout) : camRect(s.layout), b = camRect(s.layout), g = easeIO(lt / MOVE);
  const r = a === b ? b : { x: lerp(a.x, b.x, g), y: lerp(a.y, b.y, g), w: lerp(a.w, b.w, g), h: lerp(a.h, b.h, g) };
  Object.assign(camEl.style, { left: px(r.x), top: px(r.y), width: px(r.w), height: px(r.h), fontSize: px(r.w / 1156 * 46) });
  const pNow = s.paras.map(p => PARA[p]).filter(p => t >= p.start - 1e-6).pop();
  camPid.textContent = pNow ? pNow.id : '';
  // 左下目录（只在版式 B）
  if (s.layout === 'B') {
    if (tocChap !== s.chapter) buildToc(s);
    const inA = (prev && prev.layout === 'B' && prev.chapter === s.chapter) ? 1 : easeOut((lt - 0.3) / 0.4);
    const outA = (next && next.layout === 'B' && next.chapter === s.chapter) ? 1 : 1 - easeIn((lt - (dur - 0.3)) / 0.3);
    tocEl.style.opacity = Math.min(inA, outA);
    tocEl.querySelectorAll('.it').forEach(e => { const k = +e.dataset.i; e.className = 'it' + (k === s.toc ? ' now' : k < s.toc ? ' done' : ''); });
  } else tocEl.style.opacity = 0;
  // 画面内容淡入淡出
  if (!cur.api.noFade) {
    const delay = prev && prev.layout !== s.layout ? 0.3 : 0;
    const ain = easeOut((lt - delay) / FIN), aout = 1 - easeIn((lt - (dur - FOUT)) / FOUT);
    cur.root.style.opacity = Math.min(ain, aout);
    cur.root.style.transform = `translateY(${(1 - ain) * 14}px)`;
  } else { cur.root.style.opacity = 1; cur.root.style.transform = 'none'; }
  cur.api.update(lt);
  await flush();
  return true;
};
window.META = { FPS, TOTAL: TLD.total, W: 2340, H: 1080 };
</script>
