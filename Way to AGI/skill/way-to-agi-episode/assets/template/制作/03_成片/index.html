<meta charset="utf-8">
<!-- 教程《如何使用 Claude 来低成本地生成视频》成片（2340×1080，30 fps）：用户出镜口播 + 演示画面 + 中英字幕 + 片尾。
     renderAt(t) 画出第 t 秒：同一个 t 永远是同一帧。时间轴在 timeline.js（build_timeline.py 按剪好的口播生成）。
     版式：A = 出镜大框在左、右边写要点；B = 出镜缩到左上角、左下是本章目录、右边放演示；C = 作品展示；F = 片尾动画（全屏）。
     字幕在 y 922 以下，演示内容不进这条带。 -->
<link rel="stylesheet" href="file:///D:/大疆/AI科普/素材/字体/fonts.css">
<style>
:root { --ink:#1B1B1F; --ink2:#374151; --gray:#6B7280; --gray2:#9AA1AC; --line:#E5E7EB; --soft:#F4F5F7; --orange:#FF4F1A; --marker:#FFD84D; --green:#16A34A; --red:#DC2626; }
* { box-sizing:border-box; margin:0; padding:0; }
html, body { width:2340px; height:1080px; background:#fff; overflow:hidden; font-family:'Noto Sans SC', sans-serif; color:var(--ink); }
#stage, .root { position:absolute; inset:0; }
.abs { position:absolute; }
.frame { position:absolute; background:#fff; padding:14px; border:1px solid var(--line); border-radius:10px; box-shadow:0 14px 36px rgba(0,0,0,.14); }
.frame .inner { position:relative; width:100%; height:100%; border-radius:4px; overflow:hidden; background:#EEF0F3; }
.frame .inner > img { position:absolute; left:0; top:0; width:100%; height:100%; object-fit:cover; display:block; }
.tape { position:absolute; width:150px; height:40px; background:rgba(255,214,140,.8); top:-18px; box-shadow:0 1px 2px rgba(0,0,0,.08); z-index:3; }
.tape.l { left:44px; transform:rotate(-7deg); }
.tape.r { right:44px; transform:rotate(6deg); }
.tape.s { width:110px; height:32px; top:-15px; }
.card { position:absolute; background:var(--soft); border-radius:14px; }
.wcard { position:absolute; background:#fff; border:1px solid var(--line); border-radius:14px; box-shadow:0 8px 24px rgba(0,0,0,.08); }
.chip { display:inline-block; padding:5px 18px; border:3px solid var(--orange); color:var(--orange); border-radius:999px; font:800 26px 'Noto Sans SC'; white-space:nowrap; }
.h1 { font:800 52px/1.25 'Noto Sans SC'; white-space:nowrap; }
.big { font:800 84px/1.22 'Noto Sans SC'; }
.mark { background:linear-gradient(transparent 58%, var(--marker) 58%, var(--marker) 92%, transparent 92%); }
.note { position:absolute; font:500 22px 'Noto Sans SC'; color:var(--gray2); white-space:nowrap; }
.code { position:absolute; background:#1E1F22; color:#D4D4D4; border-radius:14px; padding:30px 36px; font:500 28px/1.7 'JetBrains Mono','Noto Sans SC', monospace; white-space:pre; overflow:hidden; box-shadow:0 14px 36px rgba(0,0,0,.18); }
.code .k { color:#C792EA; } .code .s { color:#C3E88D; } .code .c { color:#7F848E; } .code .n { color:#F78C6C; } .code .f { color:#82AAFF; } .code .t { color:#F07178; }
.caret { display:inline-block; width:14px; height:30px; background:var(--orange); vertical-align:-5px; }
.sprite { position:absolute; image-rendering:pixelated; }
.num { display:inline-flex; width:52px; height:52px; border-radius:50%; background:var(--orange); color:#fff; font:800 30px 'Space Grotesk'; align-items:center; justify-content:center; flex:none; }
.bl { display:flex; align-items:center; gap:22px; font:700 44px/1.3 'Noto Sans SC'; }
.hl { position:absolute; border:5px solid var(--orange); border-radius:12px; box-shadow:0 0 0 4px rgba(255,79,26,.18); }
.lab { position:absolute; background:var(--orange); color:#fff; font:800 26px 'Noto Sans SC'; padding:4px 14px; border-radius:8px; white-space:nowrap; }
.row { display:flex; align-items:center; }
.tag0 { display:inline-block; background:#E8F7EE; color:var(--green); border-radius:8px; padding:2px 14px; font:800 30px 'Space Grotesk','Noto Sans SC'; white-space:nowrap; }
.tagr { display:inline-block; background:#FDECEC; color:var(--red); border-radius:8px; padding:2px 14px; font:800 30px 'Noto Sans SC'; white-space:nowrap; }
.tago { display:inline-block; background:#FFF1E8; color:var(--orange); border-radius:8px; padding:2px 14px; font:800 30px 'Noto Sans SC'; white-space:nowrap; }
.ok { color:var(--green); font-weight:800; } .no { color:var(--red); font-weight:800; }
.dash { position:absolute; border:4px dashed #C9CED6; border-radius:16px; background:#FAFBFC; }
.stamp { position:absolute; border:6px solid var(--orange); color:var(--orange); border-radius:14px; padding:8px 26px; font:900 52px 'Noto Sans SC'; transform-origin:center; white-space:nowrap; background:rgba(255,255,255,.9); }
/* 左下目录 */
#toc { left:48px; top:492px; width:696px; height:408px; padding:26px 30px; z-index:5; }
#toc .t { font:800 30px 'Noto Sans SC'; margin-bottom:14px; white-space:nowrap; }
#toc .it { display:flex; align-items:center; gap:12px; font:500 26px/1.5 'Noto Sans SC'; color:#B0B6BF; white-space:nowrap; }
#toc .it .b { width:6px; height:28px; border-radius:3px; background:transparent; flex:none; }
#toc .it.done { color:var(--gray); }
#toc .it.now { color:var(--ink); font-weight:800; }
#toc .it.now .b { background:var(--orange); }
/* 出镜框 */
#cam { z-index:10; }
#cam .inner { background:#DADDE2; }
#cam .inner > img { object-fit:cover; transform-origin:55.5% 38%; }
#nametag { position:absolute; left:34px; bottom:34px; z-index:4; display:flex; align-items:baseline; gap:12px; background:var(--orange); color:#fff; border-radius:10px; padding:8px 22px; box-shadow:0 6px 16px rgba(0,0,0,.18); }
#nametag b { font:900 40px 'Noto Sans SC'; }
#nametag span { font:700 26px 'Space Grotesk'; opacity:.9; }
/* 字幕：中文一行 + 英文一行，按整个画面居中 */
#subs { position:absolute; left:0; top:922px; width:2340px; height:130px; z-index:30; pointer-events:none; }
#subZh { position:absolute; left:0; right:0; top:0; text-align:center; font:800 52px/66px 'Noto Sans SC'; color:var(--ink); -webkit-text-stroke:10px #fff; paint-order:stroke fill; white-space:nowrap; }
#subEn { position:absolute; left:0; right:0; top:70px; text-align:center; font:600 30px/40px 'Noto Sans SC'; color:#4B5563; -webkit-text-stroke:6px #fff; paint-order:stroke fill; white-space:nowrap; }
</style>

<body>
<div id="stage"></div>
<div class="card" id="toc"></div>
<div class="frame" id="cam">
  <div class="tape l s"></div><div class="tape r s"></div>
  <div class="inner"><img id="camimg" alt=""></div>
  <div id="nametag"><b>悠一</b><span>Yui</span></div>
</div>
<div id="subs"><div id="subZh"></div><div id="subEn"></div></div>
<script src="timeline.js"></script>
<script src="../00_整片/data.js"></script>
<script>
// ======================================================================= 基础
const TLD = window.TL, D = window.DATA, FPS = TLD.fps, CUE = TLD.cues;
const SX = 790, SY = 40, SW = 1502, SB = 900;           // 版式 B 的演示区（下沿 900，下面是字幕）
const RX = 1400, RW = 880;                             // 版式 A 的右侧要点区
const CAM = { A: { x: 120, y: 150, w: 1156, h: 666, z: 1.06 }, P: { x: 48, y: 48, w: 696, h: 402, z: 1.3 } };
const MOVE = 0.7, FIN = 0.45, FOUT = 0.3;
const WH = 'file:///D:/大疆/AI科普/素材/角色/大肥鱼像素素材包/素材/动作帧';
const M1 = '../00_整片/media', M2 = 'media';
const NCAM = Math.round(TLD.narr * FPS);
window.__ERR = [];

const clamp = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x));
const easeOut = x => 1 - Math.pow(1 - clamp(x), 3);
const easeIn = x => Math.pow(clamp(x), 3);
const easeIO = x => { x = clamp(x); return x < .5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2; };
const lerp = (a, b, x) => a + (b - a) * x;
const px = v => v + 'px';
const pad = (n, k) => String(n).padStart(k, '0');

function units(text) {   // 和 build_timeline.py 的 units() 一样
  let u = 0;
  for (const m of text.matchAll(/[A-Za-z][A-Za-z\-]*|\d|[\u4e00-\u9fff]|[，、：；,]|[。？！?!]/g)) {
    const s = m[0];
    if (/^[A-Za-z]/.test(s)) u += 1.5; else if (/^\d$/.test(s)) u += 1.1;
    else if ('，、：；,'.includes(s)) u += 0.9; else if ('。？！?!'.includes(s)) u += 1.6; else u += 1;
  }
  return u;
}
// 全角括号里是没说出口的注释（规范见技能 references/subtitles.md）：对齐说话时间时不算
const spoken = s => s.replace(/（[^（）]*）/g, '');
// 第 i 句字幕里第 k 个字（k 是 spoken(zh) 里的位置）在第几秒说出来（按逐词识别的对照表插值）
function cueT(i, k) {
  const c = CUE[i], z = spoken(c.zh), f = units(z.slice(0, k)) / Math.max(units(z), 1e-6), m = c.map;
  for (let j = 1; j < m.length; j++) if (f <= m[j][0] + 1e-9) { const a = m[j - 1], b = m[j]; return a[1] + (b[1] - a[1]) * (b[0] > a[0] ? (f - a[0]) / (b[0] - a[0]) : 0); }
  return c.e;
}
function timer(s) {
  return {
    dur: s.end - s.start,
    c0: i => CUE[i].s - s.start,
    c1: i => CUE[i].e - s.start,
    // 这个画面里第一次说到 phrase 的时刻（画面内的秒数）；from = 从第几句开始找
    at(phrase, off = 0, from = s.cue0) {
      for (let i = from; i <= s.cue1; i++) { const k = spoken(CUE[i].zh).indexOf(phrase); if (k >= 0) return cueT(i, k) - s.start + off; }
      throw new Error(`「${phrase}」不在 ${s.id} ${s.type}`);
    },
  };
}

function mk(parent, cls = '', style = {}, html = '', tag = 'div') {
  const e = document.createElement(tag);
  if (cls) e.className = cls;
  for (const [k, v] of Object.entries(style)) if (v !== undefined && v !== null) e.style[k] = typeof v === 'number' && !['opacity', 'zIndex', 'fontWeight', 'lineHeight', 'flex'].includes(k) ? px(v) : v;
  if (html) e.innerHTML = html;
  parent.appendChild(e);
  return e;
}
const at = (parent, x, y, w, h, cls = '', style = {}, html = '') => mk(parent, 'abs ' + cls, Object.assign({ left: x, top: y, width: w, height: h }, style), html);

// 出现 / 消失：t0 开始淡入，t1（可选）开始淡出
function show(el, lt, t0, o = {}) {
  const d = o.d ?? 0.4, dy = o.dy ?? 18, dx = o.dx ?? 0;
  const a = easeOut((lt - t0) / d);
  const b = o.t1 == null ? 1 : 1 - easeIn((lt - o.t1) / (o.d1 ?? 0.3));
  const v = Math.min(a, b);
  el.style.opacity = v;
  el.style.visibility = v < 0.002 ? 'hidden' : 'visible';
  el.style.transform = `translate(${dx * (1 - a)}px, ${dy * (1 - a)}px)` + (o.scale ? ` scale(${lerp(o.scale, 1, a)})` : '') + (o.rot ? ` rotate(${o.rot}deg)` : '');
  return v;
}

const PENDING = new Set();
function setSrc(img, src) {
  if (img.dataset.src !== src) { img.dataset.src = src; img.src = src; PENDING.add(img); }
}
function image(parent, src, style = {}) { const i = mk(parent, '', style, '', 'img'); setSrc(i, src); return i; }
async function flush() {
  const arr = [...PENDING]; PENDING.clear();
  await Promise.all(arr.map(i => i.decode().catch(() => window.__ERR.push('图片加载失败 ' + i.dataset.src))));
}
// 带胶带的画框，返回 inner
function frameBox(parent, x, y, w, h, tape = true) {
  const f = at(parent, x, y, w, h, 'frame');
  if (tape) { mk(f, 'tape l'); mk(f, 'tape r'); }
  const inner = mk(f, 'inner');
  return { f, inner };
}
// 顶部标题：chip + 大标题
function header(root, chip, title) {
  const h = at(root, SX, SY + 6, SW, 130);
  mk(h, 'chip', {}, chip);
  mk(h, 'h1', { marginTop: 14 }, title);
  return h;
}
const lab = (text, extra = '') => `<span class="lab" style="position:static;${extra}">${text}</span>`;

// 像素角色：12 帧呼吸（毫秒）
const BREATH = [600, 140, 400, 140, 140, 520, 140, 60, 150, 70, 140, 140], BSUM = 2640;
function breathIdx(ms) { let m = ((ms % BSUM) + BSUM) % BSUM; for (let i = 0; i < 12; i++) { if (m < BREATH[i]) return i; m -= BREATH[i]; } return 11; }
function sprite(parent, x, y, scale) { return mk(parent, 'sprite', { left: x, top: y, width: 64 * scale, height: 64 * scale }, '', 'img'); }
function setSprite(img, key, lt) { setSrc(img, `${WH}/${key}/${pad(breathIdx(lt * 1000), 2)}.png`); }

// 屏幕录制（1402×1020）的剪辑表播放器：cuts = [[权重, 原片起, 原片止, 镜头[中心x, 中心y, 放大], 高亮框, 说明], …]，按 [u0, u1] 铺满
function srPlayer(inner, bw, bh) {
  const img = mk(inner, 'abs', { left: 0, top: 0, width: 1402, height: 1020, transformOrigin: '0 0' }, '', 'img');
  const hl = mk(inner, 'abs', { border: '5px solid var(--orange)', borderRadius: 10, boxShadow: '0 0 0 9999px rgba(0,0,0,.38)', display: 'none' });
  const plan = (cuts, u0, u1) => {
    const W = cuts.reduce((a, c) => a + c[0], 0), k = (u1 - u0) / W;
    let acc = u0;
    return cuts.map(c => { const o = { u0: acc, u1: acc + c[0] * k, s0: c[1], s1: c[2], cam: c[3], hl: c[4], note: c[5] }; acc = o.u1; return o; });
  };
  const draw = (seg, prev, u) => {
    const x = prev ? easeIO((u - seg.u0) / 0.35) : 1, a = prev ? prev.cam : seg.cam, b = seg.cam;
    const cam = [lerp(a[0], b[0], x), lerp(a[1], b[1], x), lerp(a[2], b[2], x)];
    const src = lerp(seg.s0, seg.s1, clamp((u - seg.u0) / (seg.u1 - seg.u0)));
    setSrc(img, `${M1}/sr_all/f_${pad(clamp(Math.round(src * 30), 0, 1326) + 1, 4)}.jpg`);
    const sc = bw / 1402 * cam[2];
    const tx = clamp(bw / 2 - cam[0] * sc, bw - 1402 * sc, 0), ty = clamp(bh / 2 - cam[1] * sc, bh - 1020 * sc, 0);
    img.style.transform = `translate(${tx}px, ${ty}px) scale(${sc})`;
    if (seg.hl) {
      const [x0, y0, x1, y1] = seg.hl, al = easeOut((u - seg.u0) / 0.25);
      Object.assign(hl.style, { display: 'block', opacity: al, left: px(tx + x0 * sc), top: px(ty + y0 * sc), width: px((x1 - x0) * sc), height: px((y1 - y0) * sc) });
    } else hl.style.display = 'none';
  };
  return { plan, draw };
}
const FULL = [701, 510, 1];

// ======================================================================= 画面
const S = {};

// ---- 开场（A）
S.intro = (root, s) => {
  const tm = timer(s), tS = tm.at('如何用');
  const box = at(root, RX, 200, RW, 600);
  const c = mk(box, 'chip', {}, 'Claude 做视频 · 教程');
  const t = mk(box, 'big', { marginTop: 30 }, '如何用 Claude<br><span class="mark">低成本</span>地生成视频');
  const sub = mk(box, '', { marginTop: 34, font: "500 32px/1.6 'Noto Sans SC'", color: 'var(--gray)' }, 'Opus 5.5 · 写代码做视频<br>原理 · 拆解 · 成本');
  return { update(lt) { show(c, lt, 0.3); show(t, lt, 0.5); show(sub, lt, tS); } };
};

// ---- Opus 5.5：最强 + 降价 20%
S.opus55 = (root, s) => {
  const tm = timer(s), tBars = tm.at('它现在的能力'), tP = tm.at('它的价格') - 0.4, tV = tm.at('但是所有人');
  const h = header(root, '9 月 22 日', 'Claude Opus 5.5 发布');
  const chart = at(root, SX, 190, SW, 640);
  mk(chart, '', { font: "700 30px 'Noto Sans SC'", color: 'var(--ink2)' }, 'Artificial Analysis 智能指数（截至 9 月 28 日）');
  const rows = [['Claude Opus 5.5', 57.6], ['Claude Fable 5.1', 53.4], ['GPT-6 Astra', 52.7], ['Muse Spark 1.3', 48.1], ['GPT-6 Sol', 47.5], ['Grok 4.7', 46.4], ['MiMo-V2.6-Pro', 46.3]];
  const bars = rows.map(([name, v], i) => {
    const y = 70 + i * 72;
    mk(chart, 'abs', { left: 0, top: y, width: 330, textAlign: 'right', font: `${i ? 600 : 800} 30px 'Noto Sans SC'`, color: i ? 'var(--ink2)' : 'var(--ink)' }, name);
    const bar = mk(chart, 'abs', { left: 360, top: y + 4, height: 44, width: 0, borderRadius: 8, background: i ? '#C9CED6' : 'var(--orange)' });
    const val = mk(chart, 'abs', { left: 360, top: y + 2, font: `800 32px 'Space Grotesk'`, color: i ? 'var(--gray)' : 'var(--orange)' }, v.toFixed(1));
    return { bar, val, v };
  });
  const lead = mk(chart, 'abs', { left: 1300, top: 70, font: "800 34px 'Noto Sans SC'", color: 'var(--orange)' }, '← 第一名');
  const src1 = at(root, SX, 846, SW, 40, 'note', {}, '来源：Artificial Analysis 智能指数 v4.3.2，2026-09-28');
  const price = at(root, SX, 190, SW, 640);
  const col = (x, name, val, dim) => {
    const c = mk(price, 'wcard', { left: x, top: 60, width: 560, height: 330, padding: '34px 40px' });
    mk(c, '', { font: "700 34px 'Noto Sans SC'", color: dim ? 'var(--gray)' : 'var(--ink)' }, name);
    mk(c, '', { font: "800 92px/1.3 'Space Grotesk'", color: dim ? '#B0B6BF' : 'var(--orange)', marginTop: 20, textDecoration: dim ? 'line-through' : 'none' }, val);
    mk(c, '', { font: "500 26px 'Noto Sans SC'", color: 'var(--gray)', marginTop: 10 }, '每百万 token · 输入 / 输出');
    return c;
  };
  const c5 = col(0, 'Claude Opus 5', '$5 / $25', true);
  const arrow = mk(price, 'abs', { left: 590, top: 170, font: "800 80px 'Noto Sans SC'", color: 'var(--gray2)' }, '→');
  const c55 = col(700, 'Claude Opus 5.5', '$4 / $20', false);
  const badge = mk(price, 'abs', { left: 1290, top: 80, width: 200, height: 200, borderRadius: '50%', background: 'var(--orange)', color: '#fff', display: 'flex', alignItems: 'center', justifyContent: 'center', font: "800 60px 'Space Grotesk'", transformOrigin: 'center' }, '−20%');
  const vis = mk(price, 'abs', { left: 0, top: 450, width: SW, font: "800 46px 'Noto Sans SC'" }, '但没人想到：它的<span class="mark">视觉能力</span>那么强');
  const src2 = at(root, SX, 846, SW, 40, 'note', {}, '来源：Anthropic 官方价格页、Opus 5.5 发布页（2026-09-22）');
  return {
    update(lt) {
      show(h, lt, 0.2);
      show(chart, lt, tBars - 0.3, { t1: tP });
      show(src1, lt, tBars, { t1: tP });
      bars.forEach((b, i) => {
        const g = easeOut((lt - tBars - i * 0.08) / 1.2);
        b.bar.style.width = px(g * b.v / 60 * 860);
        b.val.style.left = px(360 + g * b.v / 60 * 860 + 18);
        b.val.style.opacity = g;
      });
      show(lead, lt, tm.at('最强的'), { t1: tP });
      show(price, lt, tP + 0.3);
      show(c5, lt, tP + 0.4); show(arrow, lt, tP + 0.8, { dx: -20, dy: 0 }); show(c55, lt, tP + 1.0);
      show(badge, lt, tm.at('20%'), { scale: 0.6 });
      show(vis, lt, tV);
      show(src2, lt, tP + 0.6);
    },
  };
};

// ---- GPT-6 的 3D 建模：房子里穿梭（说到客厅、书房就切到那个房间）
S.gpt6 = (root, s) => {
  const tm = timer(s), tA = 0.5, tB = tm.at('就比如说'), tLiv = tm.at('客厅'), tK = tm.at('书房') - 0.15, tG = tm.at('跟随镜头'), tO = tm.at('但是没有人想到');
  const h = header(root, 'GPT-6', 'GPT-6：3D 建模很厉害');
  const fb = frameBox(root, SX + 137, 196, 1228, 703);          // 内框 1200×675
  const img = image(fb.inner, `${M2}/gpt6_full/f_001.jpg`);
  const cap = mk(fb.inner, 'abs', { left: 16, bottom: 14, zIndex: 2 }, lab('GPT-6 · 3D 建模演示', 'background:rgba(27,27,31,.78)'));
  const room = mk(fb.inner, 'abs', { left: 16, top: 14, zIndex: 2 });
  const game = mk(fb.inner, 'abs', { right: 16, top: 14, zIndex: 2 }, lab('跟着镜头自由穿梭，像游戏一样'));

  const tZ0 = tm.at('角色说话的嘴巴') - 0.2, tZ1 = tm.c1(34) + 0.25;
  const slotHTML = (it, lt) => {

    }
    let html = `<div style="font:800 44px/1.25 'Noto Sans SC'">${it.title}</div><div style="margin-top:14px;font:500 28px/1.5 'Noto Sans SC';color:#6B7280">${it.sub}</div>`;

      vf.style.top = px(CY - (hh + 2 * PAD) / 2); vf.style.height = px(hh + 2 * PAD);

        const k = clamp(Math.floor((lt - it.t0) * FPS), 0, it.n - 1);
        setSrc(imgs[i], `${M2}/show/${it.key}/f_${pad(k + 1, 4)}.jpg`);
        slots[i].style.opacity = clamp(w[i] * 2 - 1);

          zlab.style.opacity = g * w[i];
        } else imgs[i].style.transform = 'none';
      });
      if (pi === 0) zlab.style.opacity = 0;
    },

// ---- 扩散模型：不擅长文字；从噪点里还原图像
S.diffusion = async (root, s) => {
  const tm = timer(s);
  const h = header(root, '扩散模型', '从随机噪点里，还原出一个图像');
  const bad = at(root, SX, 200, SW, 80, '', { font: "800 42px 'Noto Sans SC'" }, '<span class="no">✗</span> 不能很好地生成<span class="mark">文字</span>');
  const src = new Image(); src.src = `${M1}/gpt6_still.jpg`; await src.decode();
  const W = 270, H = 152, alphas = [1, 0.78, 0.55, 0.3, 0];
  const labels = ['随机噪点', '还原', '还原', '还原', '一个图像'];
  let seed = 20260928; const rnd = () => (seed = (seed * 1664525 + 1013904223) >>> 0) / 4294967296;
  const panels = alphas.map((a, i) => {
    const wrap = at(root, SX + i * 300, 330, W, H + 60);
    const cv = mk(wrap, '', { width: W, height: H, borderRadius: 10, boxShadow: '0 8px 20px rgba(0,0,0,.12)' }, '', 'canvas');
    cv.width = W; cv.height = H;
    // 本地图片会让画布不能读像素（getImageData 报跨域），所以另做一张噪点图，按比例叠在原图上面
    const g = cv.getContext('2d'); g.drawImage(src, 0, 0, W, H);
    const nz = document.createElement('canvas'); nz.width = W; nz.height = H;
    const ng = nz.getContext('2d'), d = ng.createImageData(W, H);
    for (let p = 0; p < d.data.length; p += 4) { d.data[p] = rnd() * 255; d.data[p + 1] = rnd() * 255; d.data[p + 2] = rnd() * 255; d.data[p + 3] = 255; }
    ng.putImageData(d, 0, 0);
    g.globalAlpha = a; g.drawImage(nz, 0, 0); g.globalAlpha = 1;
    mk(wrap, '', { marginTop: 14, textAlign: 'center', font: `${i === 4 ? 800 : 600} 26px 'Noto Sans SC'`, color: i === 4 ? 'var(--orange)' : 'var(--gray)' }, labels[i]);
    return wrap;
  });
  const arrows = [0, 1, 2, 3].map(i => at(root, SX + i * 300 + W + 4, 330 + H / 2 - 24, 30, 50, '', { font: "800 36px 'Noto Sans SC'", color: 'var(--gray2)' }, '›'));
  const line = at(root, SX, 620, SW, 80, '', { font: "800 46px 'Noto Sans SC'" }, '→ 还原出一个<span class="mark">图像</span>，或者一个<span class="mark">视频</span>');
  const t0 = tm.at('随机噪点'), t1 = tm.at('还原出来一个图像');
  return {
    update(lt) {
      show(h, lt, 0.2); show(bad, lt, tm.at('不能很好地') - 0.2);
      panels.forEach((p, i) => show(p, lt, t0 + (t1 - t0) * i / 4.5));
      arrows.forEach((a, i) => show(a, lt, t0 + (t1 - t0) * (i + 0.5) / 4.5, { dy: 0 }));

// ---- 一秒 30 张图，再加一条声音；20 秒 = 600 张

  }
  const l30 = at(root, SX, 350, SW, 60, '', { font: "800 44px 'Noto Sans SC'" }, '1 秒 = <span style="color:var(--orange)">30 张</span>');
  const wave = at(root, SX, 430, SW, 90);
  const bars = D.wave.filter((_, i) => i % 3 === 0).slice(0, 120).map((v, i) => mk(wave, 'abs', { left: i * 12.5, top: 45 - (6 + v * 70) / 2, width: 8, height: 6 + v * 70, borderRadius: 4, background: '#93C5FD' }));

const sceneIdx = t => { const sc = TLD.scenes; for (let i = sc.length - 1; i >= 0; i--) if (t >= sc[i].start - 1e-6) return i; return 0; };
const camRect = L => L === 'A' ? CAM.A : CAM.P;

function buildToc(s) {
  const ch = TLD.chapters[s.chapter];
  tocEl.innerHTML = `<div class="t">${ch.title}</div>` + ch.items.map((t, i) => `<div class="it" data-i="${i}"><span class="b"></span>${t}</div>`).join('');
  tocChap = s.chapter;
}
// 字幕：第 i 句从它开始前 0.1 秒显示到结束后 0.45 秒（不和下一句重叠）
function subAt(t) {
  if (t >= TLD.narr) return null;
  let k = -1;
  for (let i = 0; i < CUE.length; i++) { if (CUE[i].s - 0.1 <= t) k = i; else break; }
  if (k < 0) return null;
  const c = CUE[k], nx = CUE[k + 1];
  return t < Math.min(c.e + 0.45, nx ? nx.s - 0.1 : Infinity) ? c : null;
}

window.renderAt = async function (t) {
  const i = sceneIdx(t), s = TLD.scenes[i], prev = TLD.scenes[i - 1], next = TLD.scenes[i + 1];
  const lt = t - s.start, dur = s.end - s.start;
  if (!cur || cur.s !== s) {
    stage.innerHTML = '';
    const root = mk(stage, 'root');
    const api = await S[s.type](root, s);
    cur = { s, root, api };
  }
  // 出镜框：版式变化时移动 0.7 秒；片尾时淡出
  const L0 = prev && prev.layout !== 'F' ? prev.layout : s.layout, L1 = s.layout === 'F' ? L0 : s.layout;
  const a = camRect(L0), b = camRect(L1), g = easeIO(lt / MOVE);
  const r = a === b ? b : { x: lerp(a.x, b.x, g), y: lerp(a.y, b.y, g), w: lerp(a.w, b.w, g), h: lerp(a.h, b.h, g), z: lerp(a.z, b.z, g) };
  Object.assign(camEl.style, { left: px(r.x), top: px(r.y), width: px(r.w), height: px(r.h) });
  camEl.style.opacity = s.layout === 'F' ? 1 - easeOut(lt / 0.25) : 1;
  camImg.style.transform = `scale(${r.z})`;
  setSrc(camImg, `${M2}/cam/f_${pad(clamp(Math.floor(t * FPS + 1e-6), 0, NCAM - 1) + 1, 5)}.jpg`);
  // 名字条：只在开头
  const nv = s.type === 'intro' ? Math.min(easeOut((lt - 0.4) / 0.4), 1 - easeIn((lt - 5.2) / 0.4)) : 0;
  nameEl.style.opacity = nv; nameEl.style.transform = `translateY(${(1 - Math.min(1, nv * 1.2)) * 16}px)`;
  // 左下目录（只在版式 B）
  if (s.layout === 'B') {
    if (tocChap !== s.chapter) buildToc(s);
    const inA = (prev && prev.layout === 'B' && prev.chapter === s.chapter) ? 1 : easeOut((lt - 0.3) / 0.4);
    const outA = (next && next.layout === 'B' && next.chapter === s.chapter) ? 1 : 1 - easeIn((lt - (dur - 0.3)) / 0.3);
    tocEl.style.opacity = Math.min(inA, outA);
    tocEl.querySelectorAll('.it').forEach(e => { const k = +e.dataset.i; e.className = 'it' + (k === s.toc ? ' now' : k < s.toc ? ' done' : ''); });
  } else tocEl.style.opacity = 0;
  // 画面内容淡入淡出
  if (!cur.api.noFade) {
    const delay = prev && prev.layout !== s.layout ? 0.3 : 0;
    const ain = easeOut((lt - delay) / FIN), aout = 1 - easeIn((lt - (dur - FOUT)) / FOUT);
    cur.root.style.opacity = Math.min(ain, aout);
    cur.root.style.transform = `translateY(${(1 - ain) * 14}px)`;
  } else { cur.root.style.opacity = 1; cur.root.style.transform = 'none'; }
  cur.api.update(lt);
  // 字幕
  const c = s.layout === 'F' ? null : subAt(t);
  subZh.textContent = c ? c.zh : ''; subEn.textContent = c ? c.en : '';
  await flush();
  return true;
};
window.META = { FPS, TOTAL: TLD.total, W: 2340, H: 1080 };
</script>
