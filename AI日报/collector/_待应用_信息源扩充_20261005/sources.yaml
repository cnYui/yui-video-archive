# 《AI每日日报》信息源（2026-09-27 本机逐个实测可用；2026-10-04 又扩了一批，名单和落选原因见 docs/ai/context/20261004-*-ai-daily-sources-expansion_CN.md）
#
# tier（选题时的可信度）：
#   official   官方一手：可以单独成条
#   community  社区脚本抓官网生成的 RSS：内容是官网的，按官方看待，但要提防脚本停更
#   xproxy     X 的替代（Bluesky 镜像号、XGo 的 X 账号 RSS、Techmeme X Chatter、HN）：只当线索，不能单独成条
#   media      英文科技媒体：交叉验证；两家可靠媒体可以成条
#   cn         中文媒体 / 日报：交叉验证和国内视角
#   signal     发版、上传、文档更新：辅助信号，同一天同一来源合并成一条
#   status     服务状态：只报大面积故障
#   background 周更新闻信：背景，不单独成条
#
# kind（抓取方式）：rss | html_links | deepseek_sitemap | qwen_api | hf_models | readhub_daily | rsshub
# 过滤：exclude_categories / exclude_title（正则）/ include_keywords（标题或摘要里至少有一个）
# snapshot: true = 新条目第一次出现时抓原文存快照（核对用）
# serial: true = 排在其他源之后一个一个抓（限流严的第三方，如 XGo）；weight 负数 = 只有这一个源报道时扣分

defaults:
  timeout: 25
  rsshub_instances:        # 按顺序试；自建实例（如果装了）放最前面。2026-10-04 实测 bestblogs 最快最全（0.5–1 s，ChatGPT 更新日志只有它能出），另外两个常 429 / 503
    - https://rsshub.bestblogs.dev
    - https://rsshub.isrss.com
    - https://rsshub.ktachibana.party

seo_junk: &seo_junk ['(?i)\bbest\b.*\b(prompts?|tools?|apps?)\b', '(?i)\bhow to\b', '(?i)\bsetup\b.*\bsteps\b', '\[20\d\d\]', '(?i)price prediction|predicts? .*\b(ETH|BTC|XRP|Bitcoin|crypto)', '(?i)^opinion:', '(?i)\b(coupon|promo code|discount code)s?\b', '(?i)\bvs\.?\b.*\bwhich\b', '怎么用|教程|攻略|提示词大全']

ai_keywords: &ai_kw [AI, 人工智能, 大模型, 模型, 智能体, Agent, OpenAI, ChatGPT, GPT, Claude, Anthropic, Gemini, DeepSeek, 深度求索,
  Qwen, 通义, 千问, Kimi, 月之暗面, 智谱, GLM, MiniMax, 豆包, 字节, Seed, 混元, 文心, 百度, 阶跃, 小米, MiMo, Llama, Meta, Mistral,
  xAI, Grok, 英伟达, NVIDIA, 算力, 芯片, 机器人, 具身, AIGC, 生成式, 多模态, 推理, 开源, Copilot, Cursor, Codex]

# 综合科技媒体用的更严的关键词（不含“模型 / 字节 / 小米 / 百度 / 芯片 / 开源 / Meta”这类单独出现不一定是 AI 的词）；2026-10-04 新增，只给新加的源用
ai_keywords_en: &ai_en [AI, LLM, OpenAI, ChatGPT, GPT, Claude, Anthropic, Gemini, Gemma, DeepSeek, Qwen, Kimi, Zhipu, GLM, MiniMax, ByteDance, Doubao, Llama, "Meta AI", Muse,
  Mistral, xAI, Grok, NVIDIA, Copilot, Cursor, Codex, Perplexity, Midjourney, Sora, Suno, ElevenLabs, Veo, Seedance, Kling, "Apple Intelligence", Siri, Runway,
  "Stable Diffusion", Flux, NotebookLM, "machine learning", humanoid, humanoids, robot, robots, robotics, agentic, MCP, chatbot, chatbots]
ai_keywords_zh: &ai_zh [AI, 人工智能, 大模型, 大语言模型, 智能体, Agent, LLM, OpenAI, ChatGPT, GPT, Claude, Anthropic, Gemini, DeepSeek, 深度求索, Qwen, 通义, 千问, Kimi,
  月之暗面, 智谱, GLM, MiniMax, 豆包, 混元, 文心, 阶跃, MiMo, Llama, Mistral, xAI, Grok, 英伟达, NVIDIA, 算力, 具身, 人形机器人, AIGC, 生成式, 多模态, Copilot, Cursor,
  Codex, Sora, 可灵, Kling, Midjourney, Perplexity, 机器学习, 深度学习, 文生图, 文生视频, MCP]

# X 账号 RSS 里常见的闲聊 / 纯链接 / 回复 / 活动，进不了选题（XGo 的源用）
x_chatter: &x_chatter ['^\s*https?://\S+\s*$', '^[^\w一-鿿]{0,8}$', '^@\w+', '(?i)^(what are you|tell us|heard you|thanks?\b|thank you|congrats|happy |join us|submissions close|we.re hiring|rsvp|reminder|don.t miss|see you|good morning|gm\b)', '(?i)\b(giveaway|retweet to win|promo code|discount code)\b']

