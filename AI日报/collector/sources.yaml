  - {id: openai_devblog_olshansk, name: OpenAI 开发者博客（社区 RSS）, org: OpenAI, tier: community, kind: rss, url: "https://raw.githubusercontent.com/Olshansk/rss-feeds/main/feeds/feed_openai_developer.xml"}
