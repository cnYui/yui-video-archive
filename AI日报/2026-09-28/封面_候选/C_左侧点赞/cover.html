<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>AI每日日报 封面（白底两行）</title>
<link rel="stylesheet" href="../../../素材/字体/fonts.css">
<style>
  /* 1920x1080，白底。参考：B 站「通俗解释」的封面——纯白底、两行大字（灰色铺垫 + 橙色钩子）、一个小人在底部。
     4:3 封面是居中裁切 x 240..1680，所以文字和角色都要落在这个范围里。 */
  :root { --grey: #8C8C8C; --orange: #F5A21D; --blue: #3D8BFF; }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 1920px; height: 1080px; overflow: hidden; background: #fff; font-family: 'Noto Sans SC', sans-serif; }
  #text { position: absolute; top: 0; left: 0; width: 1920px; }
  .l { position: absolute; left: 0; width: 1920px; font-weight: 900; line-height: 1; white-space: nowrap; letter-spacing: -.02em; }
  .l span.in { display: inline-block; }
  #l1 { color: var(--grey); }
  #l2 { color: var(--orange); }
  #l1 .o { color: var(--orange); }
  #l2 .g { color: var(--grey); }
  #fish { position: absolute; image-rendering: pixelated; }
  #tag { position: absolute; left: 40px; bottom: 34px; color: var(--blue); font: 800 34px/1 'Noto Sans SC'; letter-spacing: .04em; display: none; }
</style>
</head>
<body>
  <div id="text"><div class="l" id="l1"><span class="in"></span></div><div class="l" id="l2"><span class="in"></span></div></div>
  <img id="fish" src="sprite.png" alt="">
  <div id="tag"></div>
<script>
(function () {
  'use strict';
  window.DURATION = 1;
  window.__READY__ = false;          // render.py 等 layout 量完真实字体再截图
  // *文字* 在第 1 行变橙、在第 2 行变灰（参考封面里「投资也有*性价比*？」这种一句里换色）
  const DEF = {
    line1: '铺垫一句', line2: '钩子一句？',
    l1px: 168, l2px: 236, maxw: 1400, top: 62, gap: 6, textCx: 960,
    sprite: null, scale: 9, frame: [64, 64], footRow: 62, fishX: 672, foot: 1062,
    tag: '',
  };
  const D = Object.assign({}, DEF, window.__DATA__ || {});
  const $ = id => document.getElementById(id);
  const px = v => v + 'px';
  function markup(s, cls) {
    const parts = String(s).split('*');
    return parts.map((p, i) => { const t = document.createElement(i % 2 ? 'span' : 'span'); if (i % 2) t.className = cls; t.textContent = p; return t; });
  }
  const l1 = $('l1'), l2 = $('l2'), in1 = l1.querySelector('.in'), in2 = l2.querySelector('.in');
  markup(D.line1, 'o').forEach(n => in1.appendChild(n));
  markup(D.line2, 'g').forEach(n => in2.appendChild(n));
  if (!D.line1) l1.style.display = 'none';
  const fish = $('fish');
  const S = D.scale;
  fish.style.width = px(D.frame[0] * S); fish.style.height = px(D.frame[1] * S);
  fish.style.left = px(D.fishX); fish.style.top = px(D.foot - D.footRow * S);
  if (D.tag) { $('tag').textContent = D.tag; $('tag').style.display = 'block'; }

  function fit(line, inner, maxPx) {             // shrink until the line fits maxw
    let size = maxPx;
    line.style.fontSize = px(size);
    while (inner.getBoundingClientRect().width > D.maxw && size > 96) { size -= 4; line.style.fontSize = px(size); }
    return size;
  }
  function place() {
    // both lines centred on textCx（角色站在一侧时，文字中线往另一边挪一点，画面才平衡）
    let y = D.top;
    for (const [line, inner] of [[l1, in1], [l2, in2]]) {
      if (line.style.display === 'none') continue;
      const w = inner.getBoundingClientRect().width, h = inner.getBoundingClientRect().height;
      line.style.top = px(y);
      inner.style.marginLeft = px(D.textCx - w / 2 - (1920 - 1920) / 2);
      line.style.textAlign = 'left';
      y += h + D.gap;
    }
    return y;
  }
  function layout() {
    let s1 = D.line1 ? fit(l1, in1, D.l1px) : 0, s2 = fit(l2, in2, D.l2px);
    let bottom = place();
    const fishTop = D.foot - D.footRow * S + 4 * S;     // 呆毛以下的发顶（row 4）：文字不压到头发
    while (bottom > fishTop - 12 && s2 > 120) {         // 文字太高就整体缩一点
      s2 -= 6; s1 = Math.max(96, s1 - 4);
      l2.style.fontSize = px(s2); if (D.line1) l1.style.fontSize = px(s1);
      bottom = place();
    }
    window.__LAYOUT__ = { l1px: s1, l2px: s2, bottom, fishTop };
  }
  const decoded = img => (img.decode ? img.decode().catch(() => {}) : Promise.resolve());
  Promise.all([document.fonts.ready, decoded(fish)]).then(() => { layout(); window.__READY__ = true; });
  window.renderAt = () => {};
})();
</script>
</body>
</html>
