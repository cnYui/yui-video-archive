<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<!-- 《从0到1用WorkBuddy上线一个微信小程序（完整实操）》整片：2340×1080，30 fps，白底。
     renderAt(t) 画出第 t 秒（同一个 t 永远是同一帧）。数据：timeline.js（build_page.py 生成）、frames.js（prep_frames.py 生成：每帧的录屏帧、出镜帧）。
     版式（沿用《AI时代计算机专业研究生如何用AI》第 1 期）：
       A = 出镜大框在左、右边写要点（开场口播、结尾）；
       B = 出镜缩到左上角、左下是目录、右边演示区放录屏（1474×829），字幕在 y 935 以下。
     没有出镜的地方（R0945、R0948、AI 生成的快进），出镜框换成“画外音 / 快进中”卡。
     脚本：scenes.js（截图卡片、要点）→ engine.js（renderAt）。 -->
<link rel="stylesheet" href="file:///D:/大疆/AI科普/素材/字体/fonts.css">
<style>
:root { --ink:#1B1B1F; --ink2:#374151; --gray:#6B7280; --gray2:#9AA1AC; --line:#E5E7EB; --soft:#F4F5F7; --orange:#FF4F1A; --marker:#FFD84D; --green:#16A34A; --wx:#07C160; }
* { box-sizing:border-box; margin:0; padding:0; }
html, body { width:2340px; height:1080px; background:#fff; overflow:hidden; font-family:'Noto Sans SC', sans-serif; color:var(--ink); }
.abs { position:absolute; }
.frame { position:absolute; background:#fff; padding:14px; border:1px solid var(--line); border-radius:10px; box-shadow:0 14px 36px rgba(0,0,0,.14); }
.frame .inner { position:relative; width:100%; height:100%; border-radius:4px; overflow:hidden; background:#EEF0F3; }
.tape { position:absolute; width:150px; height:40px; background:rgba(255,214,140,.8); top:-18px; box-shadow:0 1px 2px rgba(0,0,0,.08); z-index:3; }
.tape.l { left:44px; transform:rotate(-7deg); } .tape.r { right:44px; transform:rotate(6deg); }
.tape.s { width:110px; height:32px; top:-15px; }
.chip { display:inline-block; padding:5px 18px; border:3px solid var(--orange); color:var(--orange); border-radius:999px; font:800 26px 'Noto Sans SC'; white-space:nowrap; }
.chip.fill { background:var(--orange); color:#fff; }
.mark { background:linear-gradient(transparent 58%, var(--marker) 58%, var(--marker) 92%, transparent 92%); }

/* 出镜框 */
#cam { z-index:10; }
#cam .inner { background:#DDE1E6; }
#camimg { position:absolute; left:0; top:0; width:100%; height:100%; object-fit:cover; display:block; }
#cam .nametag { position:absolute; left:.9em; bottom:.9em; z-index:4; background:var(--ink); color:#fff; font:800 .8em 'Noto Sans SC'; padding:.2em .7em; border-radius:.3em; opacity:0; white-space:nowrap; }
#cam .nametag span { font:700 .8em 'Space Grotesk'; color:var(--marker); margin-left:.35em; }
/* 没有出镜时的画外音卡 */
#vo { position:absolute; inset:0; opacity:0; background:#2B2F36; overflow:hidden; }
#vo img { position:absolute; left:0; top:0; width:100%; height:100%; object-fit:cover; filter:grayscale(.85) blur(3px) brightness(.55); transform:scale(1.15); transform-origin:57% 26%; }
#vo .lab { position:absolute; left:0; right:0; top:34%; text-align:center; color:#fff; font:800 .9em 'Noto Sans SC'; letter-spacing:.06em; white-space:nowrap; }
#vo .lab small { display:block; margin-top:.35em; font:600 .5em 'Noto Sans SC'; color:#D1D5DB; letter-spacing:.02em; }
#vo .bars { position:absolute; left:50%; bottom:16%; height:1.4em; transform:translateX(-50%); display:flex; align-items:center; gap:.16em; }
#vo .bars i { display:block; width:.18em; border-radius:.09em; background:var(--marker); height:.2em; }

/* 目录 */
#toc { position:absolute; left:48px; top:492px; width:696px; height:408px; padding:26px 30px; background:rgba(255,255,255,.96); border-top:3px solid var(--orange); border-left:1px solid #E6E6E6; border-right:1px solid #E6E6E6; border-bottom:1px solid #E6E6E6; box-shadow:0 6px 18px rgba(0,0,0,.08); }
#toc .t { font:800 30px 'Noto Sans SC'; margin-bottom:12px; white-space:nowrap; }
#toc .t span { font:600 22px 'Noto Sans SC'; color:var(--gray2); margin-left:12px; }
#toc .it { display:flex; align-items:center; gap:12px; font:500 25px/1.62 'Noto Sans SC'; color:#B0B6BF; white-space:nowrap; }
#toc .it .b { width:6px; height:26px; border-radius:3px; background:transparent; flex:none; }
#toc .it .n { font:700 22px 'Space Grotesk'; width:24px; flex:none; }
#toc .it.done { color:var(--gray); }
#toc .it.now { color:var(--ink); font-weight:800; }
#toc .it.now .b { background:var(--orange); }

/* 演示区 */
#demo { left:790px; top:40px; width:1502px; height:857px; }
#scrimg { position:absolute; left:0; top:0; width:100%; height:100%; display:block; }
#ovB { position:absolute; inset:0; }
.dim { position:absolute; inset:0; background:rgba(17,17,17,.45); }
.shot { position:absolute; background:#fff; padding:12px; border-radius:12px; box-shadow:0 18px 48px rgba(0,0,0,.35); }
.shot img { display:block; width:100%; height:100%; border-radius:6px; }
.shotcap { position:absolute; left:0; right:0; text-align:center; white-space:nowrap; }
.hl { position:absolute; border:5px solid var(--orange); border-radius:10px; box-shadow:0 0 0 6px rgba(255,79,26,.18); }
.arrow { position:absolute; height:10px; background:#E11D48; border-radius:5px; transform-origin:0 50%; }
.arrow::after { content:''; position:absolute; right:-6px; top:50%; width:0; height:0; border-left:34px solid #E11D48; border-top:20px solid transparent; border-bottom:20px solid transparent; transform:translate(20px,-50%); }
.arrow.c::after { border-left-color:var(--ac); }
.badge { position:absolute; right:22px; top:20px; background:rgba(17,17,17,.84); color:#fff; font:800 34px 'Noto Sans SC'; padding:8px 22px; border-radius:12px; white-space:nowrap; }
.badge b { font-family:'Space Grotesk'; color:var(--marker); margin-left:10px; }
.chapchip { position:absolute; left:22px; top:20px; background:var(--orange); color:#fff; font:800 30px 'Noto Sans SC'; padding:8px 22px; border-radius:12px; white-space:nowrap; box-shadow:0 8px 20px rgba(0,0,0,.25); }
.chapchip span { font:700 24px 'Space Grotesk'; opacity:.85; margin-right:12px; }
.pill { position:absolute; background:rgba(17,17,17,.84); color:#fff; font:700 28px 'Noto Sans SC'; padding:10px 22px; border-radius:12px; white-space:nowrap; }
.pill b { color:#FDBA74; }
.strip { position:absolute; left:40px; right:40px; bottom:30px; height:120px; background:rgba(255,255,255,.97); border-radius:16px; box-shadow:0 12px 32px rgba(0,0,0,.3); display:flex; align-items:center; justify-content:center; gap:22px; font:800 32px 'Noto Sans SC'; white-space:nowrap; }
.strip .st { padding:12px 22px; border-radius:12px; background:var(--soft); border:2px solid var(--line); }
.strip .st.on { background:#FFF1EB; border-color:var(--orange); color:var(--orange); }
.strip .ar { color:var(--orange); font-size:36px; }

/* 版式 A 右侧要点 */
#ovA { position:absolute; left:1400px; top:150px; width:880px; height:666px; }
.pa { position:absolute; inset:0; }
.kick { font:700 26px 'Noto Sans SC'; letter-spacing:.2em; color:var(--orange); white-space:nowrap; }
.big { font:800 92px/1.15 'Noto Sans SC'; white-space:nowrap; }
.h1 { font:800 54px/1.3 'Noto Sans SC'; }
.h2 { font:800 44px/1.3 'Noto Sans SC'; white-space:nowrap; }
.li { display:flex; align-items:flex-start; gap:18px; font:700 36px/1.45 'Noto Sans SC'; margin-top:30px; color:var(--ink2); }
.li .dot { width:16px; height:16px; border-radius:50%; background:var(--orange); flex:none; margin-top:20px; }
.boxrow { display:flex; gap:22px; margin-top:36px; }
.bx { flex:1; height:150px; border-radius:16px; border:4px solid var(--ink); background:#fff; display:flex; flex-direction:column; align-items:center; justify-content:center; font:800 40px 'Noto Sans SC'; box-shadow:0 6px 0 rgba(0,0,0,.08); }
.bx small { font:600 24px 'Noto Sans SC'; color:var(--gray); margin-top:6px; }
.bx.on { border-color:var(--orange); background:#FFF1EB; color:var(--orange); }
.card2 { border-radius:18px; background:#fff; border:2px solid var(--line); box-shadow:0 10px 26px rgba(0,0,0,.08); padding:26px 30px; }
.card2 .tt { font:800 40px 'Noto Sans SC'; white-space:nowrap; }
.card2 .dd { font:600 28px/1.5 'Noto Sans SC'; color:var(--gray); margin-top:8px; }
.node { position:absolute; display:flex; flex-direction:column; align-items:center; justify-content:center; text-align:center; border-radius:18px; background:#fff; border:4px solid var(--ink); font:800 34px/1.25 'Noto Sans SC'; box-shadow:0 6px 0 rgba(0,0,0,.08); }
.node small { font:600 22px/1.35 'Noto Sans SC'; color:var(--gray); margin-top:6px; }
.node.ai { border-color:var(--orange); background:#FFF1EB; }
.node.wx { border-color:var(--wx); background:#EFFBF4; }
.node.cb { border-color:#2563EB; background:#EFF4FF; }
.lnk { position:absolute; font:800 30px 'Noto Sans SC'; color:var(--orange); white-space:nowrap; }

/* 字幕 */
#subs { position:absolute; left:0; top:935px; width:2340px; height:120px; z-index:30; pointer-events:none; }
#subZh { position:absolute; left:0; right:0; top:10px; text-align:center; font:800 52px/66px 'Noto Sans SC'; color:var(--ink); -webkit-text-stroke:10px #fff; paint-order:stroke fill; white-space:nowrap; }
</style>
</head>
<body>
<div class="frame" id="demo"><div class="tape l"></div><div class="tape r"></div>
  <div class="inner"><img id="scrimg"><div id="ovB"></div></div>
</div>
<div id="toc"></div>
<div id="ovA"></div>
<div class="frame" id="cam">
  <div class="tape l s"></div><div class="tape r s"></div>
  <div class="inner">
    <img id="camimg">
    <div id="vo"><img src="media/vo_still.jpg"><div class="lab" id="volab"></div><div class="bars" id="vobars"></div></div>
  </div>
  <div class="nametag" id="nametag">悠一<span>Yui</span></div>
</div>
<div id="subs"><div id="subZh"></div></div>
<script src="timeline.js"></script>
<script src="frames.js"></script>
<script src="scenes.js"></script>
<script src="engine.js"></script>
</body>
</html>
